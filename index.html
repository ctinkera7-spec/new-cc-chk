<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CC Luhn Checker</title>
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --text: #e0e0e0;
            --accent: #007aff;
            --valid: #34c759;
            --dead: #ff3b30;
            --unknown: #ffcc00;
            --border: #333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        h1 {
            font-size: 1.2rem;
            text-align: center;
            margin: 0 0 10px 0;
            color: var(--accent);
        }

        .input-section {
            flex: 0 0 auto;
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            height: 100px;
            background-color: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
            box-sizing: border-box;
        }

        button#check-btn {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button#check-btn:active {
            opacity: 0.8;
        }

        .output-container {
            flex: 1;
            display: flex;
            gap: 10px;
            min-height: 0;
        }

        .col {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--surface);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .col-header {
            padding: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            text-align: center;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .col.valid .col-header { background-color: rgba(52, 199, 89, 0.2); color: var(--valid); }
        .col.dead .col-header { background-color: rgba(255, 59, 48, 0.2); color: var(--dead); }
        .col.unknown .col-header { background-color: rgba(255, 204, 0, 0.2); color: var(--unknown); }

        .col-header span {
            font-size: 0.8rem;
            opacity: 0.8;
        }

        .copy-btn {
            background: none;
            border: 1px solid currentColor;
            color: inherit;
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 0.7rem;
            cursor: pointer;
        }

        .col-content {
            flex: 1;
            overflow-y: auto;
            padding: 5px;
            font-family: monospace;
            font-size: 12px;
        }

        .card-line {
            padding: 4px 6px;
            border-bottom: 1px solid #333;
            word-break: break-all;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-line:last-child {
            border-bottom: none;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--surface);
        }
        ::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <h1>CC Checker</h1>
    
    <div class="input-section">
        <textarea id="input-cards" placeholder="Enter cards (number only or number|date|cvv)..."></textarea>
        <button id="check-btn">Check</button>
    </div>

    <div class="output-container">
        <div class="col valid">
            <div class="col-header">
                Valid <span id="valid-count">0</span>
                <button class="copy-btn" id="copy-valid">Copy</button>
            </div>
            <div class="col-content" id="valid-cards"></div>
        </div>

        <div class="col dead">
            <div class="col-header">
                Dead <span id="dead-count">0</span>
                <button class="copy-btn" id="copy-dead">Copy</button>
            </div>
            <div class="col-content" id="dead-cards"></div>
        </div>

        <div class="col unknown">
            <div class="col-header">
                Unknown <span id="unknown-count">0</span>
                <button class="copy-btn" id="copy-unknown">Copy</button>
            </div>
            <div class="col-content" id="unknown-cards"></div>
        </div>
    </div>

    <script>
        function luhnCheck(cardNumber) {
            if (typeof cardNumber !== 'string') return false;
            let digits = cardNumber.replace(/\D/g, '');
            if (digits.length < 13 || digits.length > 19) return false;

            let sum = 0;
            let isEven = false;

            for (let i = digits.length - 1; i >= 0; i--) {
                let digit = parseInt(digits[i], 10);
                if (isEven) {
                    digit *= 2;
                    if (digit > 9) digit -= 9;
                }
                sum += digit;
                isEven = !isEven;
            }
            return (sum % 10) === 0;
        }

        function getBin(number) {
            const len = number.length;
            if (len >= 6) return number.substring(0, 6);
            if (len >= 4) return number.substring(0, 4);
            if (len >= 2) return number.substring(0, 2);
            return number;
        }

        function checkBins() {
            const input = document.getElementById('input-cards').value;
            const validDiv = document.getElementById('valid-cards');
            const deadDiv = document.getElementById('dead-cards');
            const unknownDiv = document.getElementById('unknown-cards');
            
            const validCount = document.getElementById('valid-count');
            const deadCount = document.getElementById('dead-count');
            const unknownCount = document.getElementById('unknown-count');

            validDiv.innerHTML = '';
            deadDiv.innerHTML = '';
            unknownDiv.innerHTML = '';
            validCount.textContent = '0';
            deadCount.textContent = '0';
            unknownCount.textContent = '0';

            const lines = input.split(/\n/);
            
            lines.forEach(line => {
                let cleanLine = line.trim();
                if (!cleanLine) return;

                let rawNumber = cleanLine.split(/[| ]/)[0];
                
                if (luhnCheck(rawNumber)) {
                    let bin = getBin(rawNumber);
                    let html = `<div class="card-line"><span>${cleanLine}</span> <span style="color:#888; font-size:0.8em">BIN: ${bin}</span></div>`;
                    validDiv.innerHTML += html;
                    validCount.textContent = parseInt(validCount.textContent) + 1;
                } else {
                    let html = `<div class="card-line">${cleanLine}</div>`;
                    deadDiv.innerHTML += html;
                    deadCount.textContent = parseInt(deadCount.textContent) + 1;
                }
            });
        }

        document.getElementById('check-btn').addEventListener('click', function(e) {
            e.preventDefault();
            checkBins();
        });

        // Fix buttons to use IDs instead of inline onclick which can fail
        document.getElementById('copy-valid').addEventListener('click', () => copyToClipboard('valid-cards'));
        document.getElementById('copy-dead').addEventListener('click', () => copyToClipboard('dead-cards'));
        document.getElementById('copy-unknown').addEventListener('click', () => copyToClipboard('unknown-cards'));

        function copyToClipboard(elementId) {
            const container = document.getElementById(elementId);
            const text = Array.from(container.children).map(el => el.innerText.split('BIN:')[0].trim()).join('\n');
            
            if (!text) return;
            
            navigator.clipboard.writeText(text).then(() => {
                // Optional: visual feedback
                const btn = event.target;
                const originalText = btn.innerText;
                btn.innerText = 'Copied!';
                setTimeout(() => btn.innerText = originalText, 1000);
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }
    </script>
</body>
</html>
