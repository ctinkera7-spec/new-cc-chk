<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZORG-Ω Bulk Luhn Checker</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #0f0f0f;
      color: #00ff00;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background-color: #1e1e1e;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
    }
    h1 {
      text-align: center;
      color: #00ff00;
    }
    textarea {
      width: 100%;
      height: 150px;
      background-color: #2a2a2a;
      color: #00ff00;
      border: 1px solid #00ff00;
      border-radius: 5px;
      padding: 10px;
      margin-bottom: 10px;
      font-family: monospace;
    }
    button {
      background-color: #00ff00;
      color: #0f0f0f;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      margin-bottom: 10px;
    }
    button:hover {
      background-color: #00cc00;
    }
    #results {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    #results th, #results td {
      border: 1px solid #00ff00;
      padding: 8px;
      text-align: center;
    }
    #results th {
      background-color: #00ff00;
      color: #0f0f0f;
    }
    #results tr:nth-child(even) {
      background-color: #2a2a2a;
    }
    #progress {
      width: 100%;
      height: 20px;
      background-color: #2a2a2a;
      border-radius: 5px;
      margin-top: 10px;
      overflow: hidden;
    }
    #progress-bar {
      height: 100%;
      background-color: #00ff00;
      width: 0%;
      transition: width 0.3s;
    }
    .valid {
      color: #00ff00;
    }
    .invalid {
      color: #ff0000;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>ZORG-Ω Bulk Luhn Checker</h1>
    <p>Enter credit card numbers (one per line) for bulk validation:</p>
    <textarea id="ccInput" placeholder="4111111111111111
5500000000000004
340000000000009"></textarea>
    <button id="validateBtn">Validate</button>
    <div id="progress">
      <div id="progress-bar"></div>
    </div>
    <table id="results">
      <thead>
        <tr>
          <th>Card Number</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="resultsBody"></tbody>
    </table>
  </div>

  <script>
    // Luhn Checker Function
    function luhnCheck(cardNumber) {
      const cleaned = cardNumber.replace(/\D/g, '');
      if (!cleaned || cleaned.length < 13 || cleaned.length > 19) return false;

      let sum = 0;
      let shouldDouble = false;

      for (let i = cleaned.length - 1; i >= 0; i--) {
        let digit = parseInt(cleaned.charAt(i), 10);

        if (shouldDouble) {
          digit *= 2;
          if (digit > 9) digit = (digit % 10) + 1;
        }

        sum += digit;
        shouldDouble = !shouldDouble;
      }

      return sum % 10 === 0;
    }

    // Bulk Validator
    async function bulkValidate() {
      const input = document.getElementById('ccInput').value.trim();
      const ccNumbers = input.split('\n').map(num => num.trim()).filter(num => num);
      const resultsBody = document.getElementById('resultsBody');
      const progressBar = document.getElementById('progress-bar');
      const validateBtn = document.getElementById('validateBtn');

      resultsBody.innerHTML = '';
      validateBtn.disabled = true;
      progressBar.style.width = '0%';

      if (ccNumbers.length === 0) {
        alert('No credit card numbers provided.');
        validateBtn.disabled = false;
        return;
      }

      const batchSize = 100;
      const total = ccNumbers.length;
      let processed = 0;

      for (let i = 0; i < total; i += batchSize) {
        const batch = ccNumbers.slice(i, i + batchSize);
        const batchResults = batch.map(num => ({
          number: num,
          isValid: luhnCheck(num)
        }));

        // Update results table
        batchResults.forEach(result => {
          const row = document.createElement('tr');
          const numberCell = document.createElement('td');
          const statusCell = document.createElement('td');

          numberCell.textContent = result.number;
          statusCell.textContent = result.isValid ? 'Valid' : 'Invalid';
          statusCell.className = result.isValid ? 'valid' : 'invalid';

          row.appendChild(numberCell);
          row.appendChild(statusCell);
          resultsBody.appendChild(row);
        });

        processed += batch.length;
        progressBar.style.width = `${(processed / total) * 100}%`;

        // Yield control to avoid freezing the browser
        await new Promise(resolve => setTimeout(resolve, 0));
      }

      validateBtn.disabled = false;
    }

    // Event Listener
    document.getElementById('validateBtn').addEventListener('click', bulkValidate);
  </script>
</body>
</html>
