<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZORG👽's Luhn Checker</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background-color: #0a0a0a;
            color: #0f0;
            text-align: center;
            padding: 20px;
            margin: 0;
            line-height: 1.6;
        }
        h1 {
            color: #f00;
            text-shadow: 0 0 5px #f00;
            margin-bottom: 30px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #111;
            padding: 20px;
            border: 1px solid #f00;
            border-radius: 5px;
        }
        input {
            background: #1a1a1a;
            color: #0f0;
            border: 1px solid #f00;
            padding: 12px;
            font-size: 16px;
            width: 100%;
            box-sizing: border-box;
            margin: 10px 0;
        }
        button {
            background: #f00;
            color: #000;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            font-weight: bold;
        }
        button:hover {
            background: #0f0;
            color: #000;
        }
        #result {
            margin-top: 20px;
            font-size: 18px;
            min-height: 24px;
            padding: 10px;
            border-radius: 3px;
        }
        .valid {
            color: #0f0;
            background: rgba(0, 255, 0, 0.1);
        }
        .invalid {
            color: #f00;
            background: rgba(255, 0, 0, 0.1);
        }
        .card-logos {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }
        .card-logos img {
            height: 30px;
            opacity: 0.5;
            transition: opacity 0.3s;
        }
        .card-logos img.active {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ZORG👽's Luhn Checker</h1>
        <p>Enter a credit card number, IMEI, or any Luhn-validated string:</p>
        <input type="text" id="inputNumber" placeholder="e.g. 4111 1111 1111 1111" maxlength="32">
        <button onclick="checkLuhn()">VALIDATE</button>
        <div id="result"></div>

        <div class="card-logos">
            <img id="visa" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0OCAzMiI+PHBhdGggZmlsbD0iIzAwNTFBNSIgZD0iTTAgMGg0OHYzMkgwVjB6bTQgMGgxMnYyNEg0VjB6bTggMGgxMnYyNEg4VjB6bTEyIDBoMTJ2MjRIMjBWMHoiLz48L3N2Zz4=" alt="Visa">
            <img id="mastercard" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0OCAzMiI+PGNpcmNsZSBmaWxsPSIjRUIwMDI2IiBjeD0iMTYiIGN5PSIxNiIgcj0iMTYiLz48Y2lyY2xlIGZpbGw9IiNGRjU5MDAiIGN4PSIzMiIgY3k9IjE2IiByPSIxNiIvPjwvc3ZnPg==" alt="Mastercard">
            <img id="amex" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0OCAzMiI+PHBhdGggZmlsbD0iIzAwN0JDQiIgZD0iTTAgMGg0OHYzMkgwVjB6bTQgMGgxMnYyNEg0VjB6bTggMGgxMnYyNEg4VjB6bTEyIDBoMjR2MjRIMTJWMHoiLz48L3N2Zz4=" alt="American Express">
        </div>
    </div>

    <script>
        function checkLuhn() {
            const input = document.getElementById('inputNumber').value.replace(/\s+/g, '');
            const resultDiv = document.getElementById('result');
            const visaLogo = document.getElementById('visa');
            const mastercardLogo = document.getElementById('mastercard');
            const amexLogo = document.getElementById('amex');

            // Reset logos
            visaLogo.classList.remove('active');
            mastercardLogo.classList.remove('active');
            amexLogo.classList.remove('active');

            if (!input || !/^\d+$/.test(input)) {
                resultDiv.textContent = "INVALID: Only numbers allowed.";
                resultDiv.className = "invalid";
                return;
            }

            // Detect card type
            let cardType = "Unknown";
            if (/^4/.test(input)) {
                cardType = "Visa";
                visaLogo.classList.add('active');
            } else if (/^5[1-5]/.test(input)) {
                cardType = "Mastercard";
                mastercardLogo.classList.add('active');
            } else if (/^3[47]/.test(input)) {
                cardType = "American Express";
                amexLogo.classList.add('active');
            }

            // Luhn Algorithm
            let sum = 0;
            let shouldDouble = false;

            for (let i = input.length - 1; i >= 0; i--) {
                let digit = parseInt(input.charAt(i), 10);

                if (shouldDouble) {
                    digit *= 2;
                    if (digit > 9) {
                        digit = (digit % 10) + 1;
                    }
                }

                sum += digit;
                shouldDouble = !shouldDouble;
            }

            const isValid = (sum % 10) === 0;
            resultDiv.textContent = isValid
                ? `✓ VALID ${cardType} (Luhn-approved)`
                : `✗ INVALID (Luhn-rejected)`;
            resultDiv.className = isValid ? "valid" : "invalid";
        }

        // Allow Enter key to trigger validation
        document.getElementById('inputNumber').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkLuhn();
            }
        });
    </script>
</body>
</html>
