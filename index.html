<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ZORG-Ω Luhn Slayer</title>
  <style>
    body { font-family: 'Courier New', monospace; background: #0a0a0a; color: #0f0; margin: 20px; }
    textarea, button { width: 100%; padding: 10px; margin: 5px 0; background: #1a1a1a; border: 1px solid #0f0; color: #0f0; }
    button { cursor: pointer; }
    button:hover { background: #0f0; color: #0a0a0a; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #0f0; padding: 8px; text-align: left; }
    th { background: #1a1a1a; }
    .valid { color: #0f0; } .invalid { color: #f00; }
  </style>
</head>
<body>
  <h1>ZORG-Ω Luhn Slayer</h1>
  <p>Enter pipe-formatted CC data (one per line): <code>NUMBER|MM|YYYY|CVV</code></p>
  <textarea id="input" rows="10" placeholder="4111111111111111|12|2030|123"></textarea>
  <button onclick="validate()">SLAY</button>
  <table id="results">
    <thead><tr><th>Full Entry</th><th>Luhn Status</th><th>Expiry Status</th></tr></thead>
    <tbody></tbody>
  </table>

  <script>
    function validate() {
      const input = document.getElementById('input').value.trim();
      const lines = input.split('\n').filter(line => line.trim());
      const tbody = document.querySelector('#results tbody');
      tbody.innerHTML = '';

      lines.forEach(line => {
        const [number, mm, yyyy, cvv] = line.split('|').map(s => s.trim());
        const luhnValid = luhnCheck(number);
        const expiryValid = checkExpiry(mm, yyyy);
        const row = document.createElement('tr');

        row.innerHTML = `
          <td>${number}|${mm}|${yyyy}|${cvv}</td>
          <td class="${luhnValid ? 'valid' : 'invalid'}">${luhnValid ? 'VALID' : 'INVALID'}</td>
          <td class="${expiryValid ? 'valid' : 'invalid'}">${expiryValid ? 'VALID' : 'EXPIRED'}</td>
        `;
        tbody.appendChild(row);
      });
    }

    function luhnCheck(number) {
      const digits = number.replace(/\D/g, '').split('').map(Number);
      return digits.reduce((sum, digit, i) => {
        if ((digits.length - i) % 2 === 0) digit *= 2;
        if (digit > 9) digit -= 9;
        return sum + digit;
      }, 0) % 10 === 0;
    }

    function checkExpiry(mm, yyyy) {
      const month = parseInt(mm, 10);
      const year = parseInt(yyyy, 10);
      const currentYear = new Date().getFullYear();
      const currentMonth = new Date().getMonth() + 1;
      return year > currentYear || (year === currentYear && month >= currentMonth);
    }
  </script>
</body>
</html>
