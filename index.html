
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luhn CC Checker</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --live: #10b981;
            --dead: #ef4444;
            --unknown: #f59e0b;
            --border: #334155;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 1rem;
        }
        h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 0.5rem; }
        p.subtitle { color: var(--text-muted); font-size: 0.9rem; }

        /* Input Area */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        textarea {
            width: 100%;
            height: 180px;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            padding: 1rem;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus { border-color: var(--accent); }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: var(--radius);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }
        button:disabled { background-color: var(--border); cursor: not-allowed; }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }

        .stat-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
        }

        .stat-card.live::before { background-color: var(--live); }
        .stat-card.dead::before { background-color: var(--dead); }
        .stat-card.unknown::before { background-color: var(--unknown); }

        .stat-count {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            text-transform: uppercase;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        .live .stat-count { color: var(--live); }
        .dead .stat-count { color: var(--dead); }
        .unknown .stat-count { color: var(--unknown); }

        /* Results Table */
        .results-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            max-height: 400px;
            overflow-y: auto;
        }

        .results-header {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 2fr;
            padding: 1rem;
            background-color: rgba(0,0,0,0.2);
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .result-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 2fr;
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
            align-items: center;
            transition: background 0.1s;
        }

        .result-row:last-child { border-bottom: none; }
        .result-row:hover { background-color: rgba(255,255,255,0.03); }

        .cc-number { font-family: 'Courier New', monospace; font-weight: 600; color: var(--text); }
        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            width: fit-content;
        }
        
        .status-live { background: rgba(16, 185, 129, 0.1); color: var(--live); border: 1px solid var(--live); }
        .status-dead { background: rgba(239, 68, 68, 0.1); color: var(--dead); border: 1px solid var(--dead); }
        .status-unknown { background: rgba(245, 158, 11, 0.1); color: var(--unknown); border: 1px solid var(--unknown); }
        .status-invalid { background: rgba(148, 163, 184, 0.1); color: var(--text-muted); border: 1px solid var(--text-muted); }

        .reason { font-size: 0.8rem; color: var(--text-muted); }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        @media (max-width: 600px) {
            .stats-grid { grid-template-columns: 1fr; }
            .results-header, .result-row { grid-template-columns: 1.5fr 1fr 1fr; }
            .results-header > :nth-child(4), .result-row > :nth-child(4) { display: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Luhn Checker</h1>
        <p class="subtitle">Paste pipe-formatted cards below (Number|MM/YY|CVV or Number|MM|YY|CVV)</p>
    </header>

    <div class="input-group">
        <textarea id="inputData" placeholder="4111111111111111|12|2025|123&#10;5500000000000004|01/26|456&#10;4000222222222222|05|2024|789"></textarea>
        <button id="analyzeBtn" onclick="analyzeCards()">Analyze</button>
    </div>

    <div class="stats-grid">
        <div class="stat-card live">
            <div class="stat-count" id="countLive">0</div>
            <div class="stat-label">Live</div>
        </div>
        <div class="stat-card dead">
            <div class="stat-count" id="countDead">0</div>
            <div class="stat-label">Dead</div>
        </div>
        <div class="stat-card unknown">
            <div class="stat-count" id="countUnknown">0</div>
            <div class="stat-label">Unknown</div>
        </div>
    </div>

    <div class="results-container" id="resultsContainer">
        <div class="results-header">
            <div>Card Details</div>
            <div>Status</div>
            <div>Reason</div>
            <div>Details</div>
        </div>
        <div id="resultsList">
            <!-- Results injected here -->
        </div>
    </div>
</div>

<script>
    // --- Logic ---

    function parseCardLine(line) {
        // Remove whitespace
        line = line.trim();
        if (!line) return null;

        // Split by pipe
        const parts = line.split('|');
        
        if (parts.length < 3) {
            return { raw: line, valid: false, reason: "Format Error: Expected at least 3 parts (Num|Date|CVV)" };
        }

        const number = parts[0].trim();
        const datePart = parts[1].trim();
        const cvv = parts[2].trim();

        // Normalize date handling
        // Formats: MM/YY, MM|YY (if split weirdly), MM/YY/CCYY
        let month = "";
        let year = "";
        
        if (datePart.includes('/')) {
            const [m, y] = datePart.split('/');
            month = m;
            year = y;
        } else if (parts.length >= 4) {
             // Handle format: Num|MM|YY|CVV
             month = parts[1].trim();
             year = parts[2].trim();
        } else {
            month = datePart;
            year = "";
        }

        // Clean up year (remove 2024 -> 24 if needed, though Luhn doesn't care about year)
        year = year.replace(/^20/, '');

        return {
            raw: line,
            number: number,
            month: month,
            year: year,
            cvv: cvv
        };
    }

    function luhnCheck(numStr) {
        let arr = (numStr + '').split('').map(x => parseInt(x));
        if (arr.length === 0) return false;
        
        // Reverse for calculation
        arr.reverse();
        
        let sum = 0;
        for (let i = 0; i < arr.length; i++) {
            let n = arr[i];
            if (i % 2 === 1) {
                n *= 2;
                if (n > 9) n -= 9;
            }
            sum += n;
        }
        
        return sum % 10 === 0;
    }

    function detectBin(number) {
        // Simple BIN lookup simulation
        if (number.startsWith('4')) return 'Visa';
        if (number.startsWith('5') || number.startsWith('2')) return 'Mastercard';
        if (number.startsWith('3')) return 'Amex';
        if (number.startsWith('6')) return 'Discover';
        return 'Unknown';
    }

    // Simulate API check
    function simulateApiCheck(cardData) {
        return new Promise((resolve) => {
            setTimeout(() => {
                const rand = Math.random();
                let status, reason, details;

                if (!cardData.valid) {
                    resolve({ ...cardData, status: 'dead', reason: cardData.reason, details: 'Invalid Format' });
                    return;
                }

                if (!luhnCheck(cardData.number)) {
                    resolve({ ...cardData, status: 'dead', reason: 'Luhn Failed', details: 'Check digit invalid' });
                    return;
                }

                // Simulate Live/Dead/Unknown
                if (rand > 0.7) {
                    status = 'live';
                    reason = 'Approved / Live';
                    details = `${detectBin(cardData.number)} • ${cardData.month}/${cardData.year} • CVV: ${cardData.cvv}`;
                } else if (rand > 0.3) {
                    status = 'dead';
                    reason = 'Declined / Invalid';
                    details = `${detectBin(cardData.number)} • ${cardData.month}/${cardData.year} • CVV: ${cardData.cvv}`;
                } else {
                    status = 'unknown';
                    reason = 'Unknown / Pending';
                    details = `${detectBin(cardData.number)} • ${cardData.month}/${cardData.year} • CVV: ${cardData.cvv}`;
                }

                resolve({ ...cardData, status, reason, details });
            }, 300 + Math.random() * 500); // Random delay 0.3-0.8s
        });
    }

    async function analyzeCards() {
        const input = document.getElementById('inputData').value;
        const btn = document.getElementById('analyzeBtn');
        const list = document.getElementById('resultsList');
        const container = document.getElementById('resultsContainer');

        if (!input.trim()) return;

        // UI Reset
        btn.disabled = true;
        btn.innerText = "Analyzing...";
        list.innerHTML = '';
        
        // Reset Counters
        let counts = { live: 0, dead: 0, unknown: 0 };
        document.getElementById('countLive').innerText = '0';
        document.getElementById('countDead').innerText = '0';
        document.getElementById('countUnknown').innerText = '0';

        const lines = input.split('\n').filter(l => l.trim() !== '');
        const promises = lines.map(line => {
            const parsed = parseCardLine(line);
            return simulateApiCheck(parsed);
        });

        const results = await Promise.all(promises);

        results.forEach(res => {
            // Update Counts
            if (['live', 'dead', 'unknown'].includes(res.status)) {
                counts[res.status]++;
            }
        });

        // Update UI Counts
        document.getElementById('countLive').innerText = counts.live;
        document.getElementById('countDead').innerText = counts.dead;
        document.getElementById('countUnknown').innerText = counts.unknown;

        // Render Rows
        results.forEach(res => {
            const row = document.createElement('div');
            row.className = 'result-row';
            
            // Format card number with spaces for readability (optional, but cleaner)
            const displayNum = res.number.replace(/(.{4})/g, '$1 ').trim();

            row.innerHTML = `
                <div class="cc-number">${displayNum}</div>
                <div><span class="status-badge status-${res.status}">${res.status}</span></div>
                <div class="reason">${res.reason}</div>
                <div class="reason" style="opacity: 0.6;">${res.details}</div>
            `;
            list.appendChild(row);
        });

        btn.disabled = false;
        btn.innerText = "Analyze";
    }
</script>

</body>
</html>
