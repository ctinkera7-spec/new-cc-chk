<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZORG-Ω Card Forge</title>
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    :root {
      --gold: #d4af37;
      --black: #0a0a0a;
      --dark: #1a1a1a;
      --shadow: 0 0 20px rgba(212, 175, 55, 0.3);
      --glow: 0 0 10px rgba(212, 175, 55, 0.5);
    }
    body {
      font-family: 'Segoe UI', 'Courier New', monospace;
      background: var(--black);
      color: var(--gold);
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }
    h1 {
      color: var(--gold);
      text-shadow: var(--glow);
      text-align: center;
      font-size: 2.5rem;
      margin-bottom: 30px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .input-section {
      background: var(--dark);
      border: 1px solid var(--gold);
      border-radius: 8px;
      padding: 20px;
      box-shadow: var(--shadow);
    }
    textarea, button, select {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      background: var(--black);
      border: 1px solid var(--gold);
      color: var(--gold);
      border-radius: 4px;
      font-family: inherit;
      font-size: 1rem;
    }
    button {
      cursor: pointer;
      transition: all 0.2s;
      background: var(--gold);
      color: var(--black);
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    button:hover {
      background: #b8952f;
      box-shadow: var(--glow);
    }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .card {
      background: var(--dark);
      border: 1px solid var(--gold);
      border-radius: 8px;
      padding: 15px;
      transition: all 0.3s;
      opacity: 0;
      transform: translateY(10px);
    }
    .card.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .card:hover {
      box-shadow: var(--glow);
      border-color: #b8952f;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--gold);
    }
    .card-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }
    .card-status {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .checkmark::before {
      content: "✓";
      color: var(--gold);
    }
    .xmark::before {
      content: "✗";
      color: #ff3366;
    }
    .bin-info {
      margin-top: 10px;
      padding: 10px;
      background: rgba(212, 175, 55, 0.1);
      border-radius: 4px;
      border-left: 3px solid var(--gold);
    }
    .stripe-element {
      background: var(--black);
      padding: 12px;
      border: 1px solid var(--gold);
      border-radius: 4px;
      margin: 10px 0;
    }
    .charge-controls {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .dropdown {
      background: var(--black);
      color: var(--gold);
      border: 1px solid var(--gold);
      padding: 8px;
      border-radius: 4px;
      flex: 1;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .fade-in {
      animation: fadeIn 0.5s ease-in-out;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>ZORG-Ω CARD FORGE</h1>

    <div class="input-section">
      <p>Enter pipe-formatted CC data (one per line): <code>NUMBER|MM|YYYY|CVV</code></p>
      <textarea id="input" rows="6" placeholder="4111111111111111|12|2030|123"></textarea>

      <div class="charge-controls">
        <select id="chargeMethod" class="dropdown">
          <option value="fake">Fake Charge (Simulated)</option>
          <option value="stripe">Stripe (Real Charge)</option>
        </select>
        <button onclick="validate()">FORGE & VALIDATE</button>
      </div>
    </div>

    <div id="stripeElement" class="stripe-element" style="display: none;">
      <div id="card-element">
        <!-- Stripe Elements will be inserted here -->
      </div>
    </div>

    <div class="card-grid">
      <div id="successBox">
        <h2>✅ LUHN VALID (FORGED)</h2>
        <div id="successCards" class="card-grid"></div>
      </div>

      <div id="deadBox">
        <h2>❌ LUHN INVALID (BROKEN)</h2>
        <div id="deadCards" class="card-grid"></div>
      </div>
    </div>
  </div>

  <script>
    // Initialize Stripe
    const stripe = Stripe('pk_live_51NMHTlLvIw0k1EPu80ivQ0HYQ9NUotEncPEpUYYytP8YkUPB4vNGYICv1rB5Emf6nD1UzKXd0wKzdXnumGJqYPDt00Huwrpsfq');
    const elements = stripe.elements();
    const cardElement = elements.create('card');
    cardElement.mount('#card-element');

    async function validate() {
      const input = document.getElementById('input').value.trim();
      const lines = input.split('\n').filter(line => line.trim());
      const successCards = document.getElementById('successCards');
      const deadCards = document.getElementById('deadCards');
      successCards.innerHTML = '';
      deadCards.innerHTML = '';

      for (const line of lines) {
        const [number, mm, yyyy, cvv] = line.split('|').map(s => s.trim());
        const luhnValid = luhnCheck(number);
        const expiryValid = checkExpiry(mm, yyyy);

        // Fetch BIN info
        const binInfo = await fetchBinInfo(number.substring(0, 6));

        if (luhnValid) {
          const card = document.createElement('div');
          card.className = 'card fade-in';
          card.innerHTML = `
            <div class="card-header">
              <strong>CARD ${lines.indexOf(line) + 1}</strong>
              <span class="status"><span class="checkmark"></span> Valid</span>
            </div>
            <div class="card-details">
              <div><strong>Number:</strong> ${number.replace(/\d{4}(?=\d)/g, '$& ')}</div>
              <div><strong>Expiry:</strong> ${mm}/${yyyy}</div>
              <div><strong>CVV:</strong> ${cvv}</div>
            </div>
            <div class="bin-info">
              <div><strong>BIN:</strong> ${binInfo.bin}</div>
              <div><strong>Brand:</strong> ${binInfo.brand || 'Unknown'}</div>
              <div><strong>Type:</strong> ${binInfo.type || 'Unknown'}</div>
              <div><strong>Level:</strong> ${binInfo.level || 'Unknown'}</div>
              <div><strong>Bank:</strong> ${binInfo.bank || 'Unknown'}</div>
              <div><strong>Country:</strong> ${binInfo.country || 'Unknown'}</div>
            </div>
            <div class="card-status">
              <div class="status ${expiryValid ? 'valid' : 'invalid'}">
                ${expiryValid ? '<span class="checkmark"></span> Expiry Valid' : '<span class="xmark"></span> Expired'}
              </div>
              <div class="status" id="charge-status-${number}"><span class="xmark"></span> Pending</div>
            </div>
            <div id="charge-reason-${number}">Awaiting charge...</div>
            <button onclick="chargeCard('${number}', '${mm}', '${yyyy}', '${cvv}')">CHARGE</button>
          `;
          successCards.appendChild(card);
          card.classList.add('visible');
        } else {
          const card = document.createElement('div');
          card.className = 'card fade-in';
          card.innerHTML = `
            <div class="card-header">
              <strong>CARD ${lines.indexOf(line) + 1}</strong>
              <span class="status"><span class="xmark"></span> Invalid</span>
            </div>
            <div class="card-details">
              <div><strong>Number:</strong> ${number.replace(/\d{4}(?=\d)/g, '$& ')}</div>
              <div><strong>Expiry:</strong> ${mm}/${yyyy}</div>
              <div><strong>CVV:</strong> ${cvv}</div>
            </div>
            <div class="card-status">
              <div class="status ${expiryValid ? 'valid' : 'invalid'}">
                ${expiryValid ? '<span class="checkmark"></span> Expiry Valid' : '<span class="xmark"></span> Expired'}
              </div>
            </div>
            <div>Reason: Luhn check failed</div>
          `;
          deadCards.appendChild(card);
          card.classList.add('visible');
        }
      }
    }

    async function fetchBinInfo(bin) {
      try {
        const response = await fetch(`https://bin-checker.net/api/${bin}`);
        const data = await response.json();
        return {
          bin: bin,
          brand: data.brand,
          type: data.type,
          level: data.level,
          bank: data.bank?.name,
          country: data.country?.name
        };
      } catch (error) {
        return {
          bin: bin,
          brand: 'Unknown',
          type: 'Unknown',
          level: 'Unknown',
          bank: 'Unknown',
          country: 'Unknown'
        };
      }
    }

    async function chargeCard(number, mm, yyyy, cvv) {
      const chargeMethod = document.getElementById('chargeMethod').value;
      const chargeStatus = document.getElementById(`charge-status-${number}`);
      const chargeReason = document.getElementById(`charge-reason-${number}`);

      if (chargeMethod === 'fake') {
        const isCharged = Math.random() > 0.5;
        if (isCharged) {
          chargeStatus.innerHTML = '<span class="checkmark"></span> Charged';
          chargeReason.textContent = 'Fake charge successful';
        } else {
          chargeStatus.innerHTML = '<span class="xmark"></span> Failed';
          chargeReason.textContent = 'Fake charge declined';
        }
      } else if (chargeMethod === 'stripe') {
        chargeStatus.innerHTML = '<span class="xmark"></span> Processing...';
        chargeReason.textContent = 'Contacting Stripe...';

        try {
          const { paymentMethod, error } = await stripe.createPaymentMethod({
            type: 'card',
            card: cardElement,
          });

          if (error) {
            chargeStatus.innerHTML = '<span class="xmark"></span> Failed';
            chargeReason.textContent = error.message;
          } else {
            chargeStatus.innerHTML = '<span class="checkmark"></span> Charged';
            chargeReason.textContent = 'Stripe charge successful';
            console.log('PaymentMethod:', paymentMethod);
          }
        } catch (error) {
          chargeStatus.innerHTML = '<span class="xmark"></span> Failed';
          chargeReason.textContent = error.message;
        }
      }
    }

    function luhnCheck(number) {
      const digits = number.replace(/\D/g, '').split('').map(Number);
      return digits.reduce((sum, digit, i) => {
        if ((digits.length - i) % 2 === 0) digit *= 2;
        if (digit > 9) digit -= 9;
        return sum + digit;
      }, 0) % 10 === 0;
    }

    function checkExpiry(mm, yyyy) {
      const month = parseInt(mm, 10);
      const year = parseInt(yyyy, 10);
      const currentYear = new Date().getFullYear();
      const currentMonth = new Date().getMonth() + 1;
      return year > currentYear || (year === currentYear && month >= currentMonth);
    }
  </script>
</body>
</html>
