
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA GATEWAY - Enhanced Mass Checker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            background-color: #020617; 
            height: 100vh; 
            overflow: hidden; 
        }
        .glass { 
            background: rgba(15, 23, 42, 0.6); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(51, 65, 85, 0.5); 
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        
        @keyframes pulse-green { 0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); } }
        @keyframes pulse-red { 0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } }
        @keyframes pulse-blue { 0%, 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); } }
        
        .live-status { animation: pulse-green 2s infinite; }
        .dead-status { animation: pulse-red 2s infinite; }
        .vbv-status { animation: pulse-blue 2s infinite; }

        .table-container {
            overflow-y: auto;
            flex: 1;
        }
        th {
            position: sticky;
            top: 0;
            z-index: 10;
            background: #0f172a;
            backdrop-filter: blur(4px);
        }
        tr:hover {
            background-color: rgba(30, 41, 59, 0.5);
        }
        .btn-copy {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-copy:hover {
            background-color: rgba(255,255,255,0.1);
        }
        
        /* Toast Notification */
        #toast {
            visibility: hidden;
            min-width: 250px; 
            background-color: #10b981;
            color: #fff;
            text-align: center;
            border-radius: 4px;
            padding: 16px;
            position: fixed;
            z-index: 50;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        #toast.show {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body class="text-slate-200 font-sans selection:bg-blue-500/30 flex flex-col h-screen p-2 lg:p-4">

    <div class="w-full max-w-7xl flex-1 flex flex-col">
        <!-- Header -->
        <header class="flex justify-between items-center mb-4 border-b border-slate-800 pb-4 shrink-0">
            <div>
                <h1 class="text-3xl font-black tracking-tighter text-white uppercase italic">
                    NOVA <span class="text-blue-500 not-italic">GATEWAY</span>
                </h1>
                <p class="text-xs font-mono text-slate-500 mt-1">Mass CC Checker // Auto-Format // VBV</p>
            </div>
            <div class="flex items-center gap-4">
                <div class="text-xs font-mono text-slate-400 bg-slate-900 px-3 py-1 rounded border border-slate-800 flex items-center gap-2">
                    <span id="status-dot" class="w-2 h-2 rounded-full bg-slate-600"></span>
                    <span id="status-text">IDLE</span>
                </div>
                <div class="flex gap-2 text-xs font-mono bg-slate-900 px-3 py-1 rounded border border-slate-800">
                    <span class="text-emerald-400">Live: <span id="count-live">0</span></span>
                    <span class="text-red-400">Dead: <span id="count-dead">0</span></span>
                    <span class="text-blue-400">VBV: <span id="count-vbv">0</span></span>
                    <span class="text-slate-500">Total: <span id="count-total">0</span></span>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 flex-1 min-h-0">
            
            <!-- Input Section -->
            <div class="lg:col-span-4 flex flex-col gap-4 h-full">
                <div class="glass p-4 rounded-xl shadow-2xl relative overflow-hidden flex flex-col h-full">
                    <h2 class="text-xs font-bold text-blue-500 uppercase tracking-widest mb-2 flex items-center gap-2 shrink-0">
                        <i class="fa-solid fa-keyboard"></i> Input Cards
                    </h2>
                    
                    <textarea id="inputData" 
                        class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm font-mono focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none resize-none text-slate-300 flex-1"
                        placeholder="Paste cards here (mixed formats supported)&#10;e.g. 444444|12|2025|123"></textarea>
                    
                    <div class="flex justify-between items-center mt-3 shrink-0">
                        <button onclick="clearInput()" class="text-xs text-slate-500 hover:text-slate-300 transition"><i class="fa-solid fa-trash"></i> Clear</button>
                        <span class="text-xs text-slate-500" id="card-count">0 cards loaded</span>
                    </div>

                    <!-- Controls -->
                    <div class="mt-3 flex flex-col gap-3 shrink-0">
                        <button onclick="startMassCheck()" id="startBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white px-4 py-3 rounded-lg text-sm font-bold shadow-lg shadow-blue-900/50 transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-bolt"></i> START MASS CHECK
                        </button>
                        
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="copyColumn('pipes')" class="bg-slate-800 hover:bg-slate-700 text-xs py-2 rounded border border-slate-700 transition"><i class="fa-solid fa-copy"></i> All Pipes</button>
                            <button onclick="copyColumn('lives')" class="bg-emerald-900/30 hover:bg-emerald-900/50 text-emerald-400 border border-emerald-900/50 text-xs py-2 rounded transition"><i class="fa-solid fa-check"></i> Live Only</button>
                            <button onclick="copyColumn('full')" class="col-span-2 bg-slate-800 hover:bg-slate-700 text-xs py-2 rounded border border-slate-700 transition"><i class="fa-solid fa-table"></i> Full Report (CSV)</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Output/Console Section -->
            <div class="lg:col-span-8 flex flex-col h-full">
                <div class="glass p-0 rounded-xl shadow-2xl relative overflow-hidden flex flex-col h-full">
                    <!-- Table -->
                    <div class="table-container">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="text-xs font-bold text-slate-500 uppercase">
                                    <th class="p-3 border-b border-slate-800 w-12">#</th>
                                    <th class="p-3 border-b border-slate-800">Raw Input</th>
                                    <th class="p-3 border-b border-slate-800">Normalized Pipe</th>
                                    <th class="p-3 border-b border-slate-800 w-24">Status</th>
                                    <th class="p-3 border-b border-slate-800">Details</th>
                                    <th class="p-3 border-b border-slate-800 w-24 text-center">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="resultsBody" class="text-sm font-mono">
                                <!-- Results will be injected here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast">Copied to clipboard!</div>

    <script>
        // Default data provided by user
        const defaultInput = `4867863024656733|12|2031|907
4867861500170955|06|2031|307
4867862080626804|09|2031|301
4867867949267872|08|2031|866
4867867761065321|01|2031|842
4867860341367903|02|2027|386
4867868777635933|10|2027|743
4867869821298892|04|2030|418
4867865744958711|07|2031|908
4867864947031053|02|2028|741
4867862133200128|08|2028|369
4867864266142358|01|2029|817
4867863069075161|07|2030|939
4867862012302292|11|2029|564
4867864668166864|11|2027|821
4867869853197129|11|2030|172
4867864290734717|11|2031|801
4867864897435338|11|2027|725
4867864563187817|07|2028|725
4867864495196928|03|2028|193
4867867845953559|02|2028|790
4867860451259536|12|2027|477
4867864919996796|04|2031|772
4867867930296252|11|2027|425
4867862689432307|09|2029|476
4867866163001033|11|2029|895
4867866556861803|06|2030|257
4867865455076935|10|2030|445
4867869685383566|12|2030|631
4867868294271055|07|2028|889
4867862181876308|03|2031|736
4867865409742954|12|2028|299
4867864560365390|04|2028|261
4867868931831493|08|2028|255
4867869541666550|11|2027|852
4867862205733576|12|2030|568
4867865257995167|09|2030|651
4867860825653711|10|2029|593
4867864009785265|01|2031|589
4867864092133670|10|2027|349
4031631179624769|05|31|475`;

        // Global State
        let results = [];
        let isProcessing = false;

        // Initialize with default data
        document.getElementById('inputData').value = defaultInput;
        updateCardCount();

        // Utility: Parse Card
        function parseCard(line) {
            // 1. Clean input: remove spaces, slashes, dashes
            let clean = line.replace(/[\s|\/\-]+/g, '');
            
            // 2. Split by digits sequence
            let parts = clean.match(/\d+/g);
            if (!parts) return null;

            // 3. Identify PAN (first long sequence)
            // Assuming PAN is the first part with >10 digits
            let panIndex = parts.findIndex(p => p.length > 10);
            if (panIndex === -1) panIndex = 0; // Fallback

            let pan = parts[panIndex];
            let remaining = [...parts.slice(0, panIndex), ...parts.slice(panIndex + 1)];

            // 4. Parse Date (MM, YY) and CVV
            let month = "";
            let year = "";
            let cvv = "";

            // Helper to find a valid MM in remaining parts
            let mmIdx = remaining.findIndex(p => p.length === 2 && parseInt(p) >= 1 && parseInt(p) <= 12);
            if (mmIdx !== -1) {
                month = remaining[mmIdx];
                remaining.splice(mmIdx, 1);
            }

            // Helper to find a valid YY (2 digits) or YYYY (4 digits)
            // Priority: Look for 4-digit first, then 2-digit
            let yyIdx = remaining.findIndex(p => p.length === 4 && parseInt(p) > 2000);
            if (yyIdx === -1) {
                yyIdx = remaining.findIndex(p => p.length === 2 && parseInt(p) < 100);
            }
            
            if (yyIdx !== -1) {
                let rawYear = remaining[yyIdx];
                if (rawYear.length === 2) {
                    year = (parseInt(rawYear) < 50) ? "20" + rawYear : "19" + rawYear;
                } else {
                    year = rawYear;
                }
                remaining.splice(yyIdx, 1);
            }

            // CVV is the last remaining part
            if (remaining.length > 0) {
                cvv = remaining[remaining.length - 1];
                if (cvv.length > 4) cvv = cvv.substring(0, 4);
            }

            // Reconstruct normalized pipe
            let normalized = `${pan}|${month.padStart(2, '0')}||${year}|${cvv}`;
            
            // Basic Validation: Does it look like a card?
            if (!month || !year) return { raw: line, pipe: normalized, valid: false };
            return { raw: line, pipe: normalized, valid: true };
        }

        function clearInput() {
            document.getElementById('inputData').value = '';
            updateCardCount();
        }

        function updateCardCount() {
            const input = document.getElementById('inputData').value.trim();
            const count = input ? input.split(/\n/).filter(l => l.trim()).length : 0;
            document.getElementById('card-count').innerText = `${count} cards loaded`;
        }

        // Listen for input changes to update count
        document.getElementById('inputData').addEventListener('input', updateCardCount);

        async function startMassCheck() {
            if (isProcessing) return;
            
            const input = document.getElementById('inputData').value.trim();
            if (!input) {
                showToast("No cards to check!", false);
                return;
            }

            const lines = input.split(/\n/).filter(l => l.trim().length > 0);
            
            // Parse all lines first
            const parsedCards = lines.map((line, idx) => {
                const p = parseCard(line);
                return {
                    id: idx + 1,
                    raw: line.trim(),
                    parsed: p
                };
            });

            if (parsedCards.length === 0) {
                showToast("No valid data found.", false);
                return;
            }

            log(`Parsed ${parsedCards.length} cards. Starting check...`, 'log-info');
            
            isProcessing = true;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('startBtn').innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';
            document.getElementById('status-text').innerText = "PROCESSING";
            document.getElementById('status-dot').className = "w-2 h-2 rounded-full bg-blue-500 live-status";

            results = []; 
            document.getElementById('resultsBody').innerHTML = '';

            // Process in batches
            const batchSize = 5; // Smaller batch for smoother UI with many cards
            for (let i = 0; i < parsedCards.length; i += batchSize) {
                const batch = parsedCards.slice(i, i + batchSize);
                await processBatch(batch);
            }

            finishProcessing();
        }

        async function processBatch(batch) {
            for (let cardObj of batch) {
                await checkSingleCard(cardObj);
                await new Promise(r => setTimeout(r, 20)); // Tiny delay for UI
            }
        }

        async function checkSingleCard(cardObj) {
            // Simulate API Call (Randomize for demo)
            await new Promise(r => setTimeout(r, Math.random() * 50 + 50)); 

            // Randomize Results for Demo
            const rand = Math.random();
            let status, message, vbvCheck;

            if (rand < 0.35) {
                status = 'LIVE';
                message = 'Approved';
                vbvCheck = Math.random() > 0.4 ? 'No' : 'Yes';
            } else if (rand < 0.55) {
                status = 'VBV';
                message = 'VBV Required';
                vbvCheck = 'Yes';
            } else {
                status = 'DEAD';
                const errors = ['Insufficient Funds', 'Do Not Honor', 'Invalid Account', 'Lost Card', 'Stolen Card', 'Processing Error'];
                message = errors[Math.floor(Math.random() * errors.length)];
                vbvCheck = 'N/A';
            }

            const result = {
                id: cardObj.id,
                raw: cardObj.raw,
                pipe: cardObj.parsed.pipe,
                status: status,
                message: message,
                vbv: vbvCheck
            };

            results.push(result);
            addResultToTable(result);
            updateCounts();
        }

        function addResultToTable(result) {
            const tbody = document.getElementById('resultsBody');
            const tr = document.createElement('tr');
            tr.className = 'border-b border-slate-800 hover:bg-slate-800/30 transition animate-fade-in';
            
            let statusClass = '';
            let statusIcon = '';
            if (result.status === 'LIVE') {
                statusClass = 'text-emerald-400 bg-emerald-900/20 border-emerald-900/50';
                statusIcon = '<i class="fa-solid fa-check"></i>';
            } else if (result.status === 'VBV') {
                statusClass = 'text-blue-400 bg-blue-900/20 border-blue-900/50';
                statusIcon = '<i class="fa-solid fa-shield-halved"></i>';
            } else {
                statusClass = 'text-red-400 bg-red-900/20 border-red-900/50';
                statusIcon = '<i class="fa-solid fa-xmark"></i>';
            }

            tr.innerHTML = `
                <td class="p-3 text-slate-500">${result.id}</td>
                <td class="p-3 text-slate-400 truncate max-w-xs" title="${result.raw}">${result.raw}</td>
                <td class="p-3 text-slate-200 font-mono break-all">${result.pipe}</td>
                <td class="p-3">
                    <span class="inline-flex items-center gap-1 px-2 py-1 rounded text-xs font-bold border ${statusClass}">
                        ${statusIcon} ${result.status}
                    </span>
                </td>
                <td class="p-3 text-slate-400">${result.message} ${result.vbv !== 'N/A' ? `<span class="text-blue-400 text-xs">(${result.vbv})</span>` : ''}</td>
                <td class="p-3 flex justify-center gap-2">
                    <button onclick="copyText('${escapeHtml(result.pipe)}')" class="btn-copy bg-slate-700 hover:bg-slate-600 text-slate-200" title="Copy Pipe">
                        <i class="fa-solid fa-copy"></i>
                    </button>
                    <button onclick="copyText('${escapeHtml(result.raw)} ${result.pipe}')" class="btn-copy bg-slate-700 hover:bg-slate-600 text-slate-200" title="Copy Full Row">
                        <i class="fa-solid fa-list"></i>
                    </button>
                </td>
            `;
            tbody.appendChild(tr);
            
            // Auto scroll
            const tableContainer = document.querySelector('.table-container');
            if (tableContainer.scrollHeight - tableContainer.scrollTop - tableContainer.clientHeight < 100) {
                tableContainer.scrollTop = tableContainer.scrollHeight;
            }
        }

        function finishProcessing() {
            isProcessing = false;
            document.getElementById('startBtn').disabled = false;
            document.getElementById('startBtn').innerHTML = '<i class="fa-solid fa-bolt"></i> START MASS CHECK';
            document.getElementById('status-text').innerText = "DONE";
            document.getElementById('status-dot').className = "w-2 h-2 rounded-full bg-emerald-500 live-status";
            showToast(`Done! ${results.length} cards checked.`, true);
        }

        // Copy Functions
        function copyText(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast("Copied to clipboard!", true);
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }

        function copyColumn(type) {
            let text = '';
            if (type === 'pipes') {
                text = results.map(r => r.pipe).join('\n');
            } else if (type === 'lives') {
                const lives = results.filter(r => r.status === 'LIVE');
                if (lives.length === 0) {
                    showToast("No live cards found!", false);
                    return;
                }
                text = lives.map(r => r.pipe).join('\n');
            } else if (type === 'full') {
                text = results.map(r => `${r.id},${r.raw},${r.pipe},${r.status},${r.message},VBV:${r.vbv}`).join('\n');
            }
            
            if (text) {
                navigator.clipboard.writeText(text);
                showToast(`Copied ${type === 'lives' ? lives.length : results.length} items!`, true);
            }
        }

        function showToast(message, success) {
            const x = document.getElementById("toast");
            x.innerText = message;
            x.className = success ? "show" : "show";
            if (!success) x.style.backgroundColor = "#ef4444";
            else x.style.backgroundColor = "#10b981";
            
            setTimeout(function(){ x.className = x.className.replace("show", ""); }, 3000);
        }

        function log(message, className) {
            console.log(`[${new Date().toLocaleTimeString()}] ${message}`);
        }

        function escapeHtml(text) {
            return text.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
