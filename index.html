
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luhn Checker Pro</title>
    <style>
        :root {
            --bg: #09090b;
            --surface: #18181b;
            --border: #27272a;
            --text: #fafafa;
            --muted: #a1a1aa;
            --primary: #6366f1;
            --live: #10b981;
            --dead: #ef4444;
            --unknown: #f59e0b;
            --radius: 8px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 20px; padding-bottom: 80px; }

        .container { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

        /* Input Section */
        .input-wrapper { position: relative; }
        textarea {
            width: 100%;
            height: 160px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            padding: 15px;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
        }
        textarea:focus { border-color: var(--primary); }

        .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: var(--radius);
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: #4f46e5; }
        .btn-secondary { background: var(--surface); border: 1px solid var(--border); color: var(--muted); }
        .btn-secondary:hover { background: #27272a; color: var(--text); }

        /* Stats */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: var(--radius);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .stat-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; }
        .stat-card.live::before { background: var(--live); }
        .stat-card.dead::before { background: var(--dead); }
        .stat-card.unknown::before { background: var(--unknown); }

        .stat-num { font-size: 2rem; font-weight: 700; margin-bottom: 5px; }
        .stat-label { text-transform: uppercase; font-size: 0.75rem; color: var(--muted); letter-spacing: 1px; }

        /* Results List */
        .results-list { display: flex; flex-direction: column; gap: 10px; }
        .card-row {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 15px;
            display: grid;
            grid-template-columns: 1fr 120px 1fr;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }
        .card-row:hover { border-color: var(--muted); background: #1f1f23; }
        
        .row-num { font-family: monospace; font-size: 1.1rem; font-weight: 600; }
        .row-status { display: flex; flex-direction: column; gap: 5px; }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            width: fit-content;
            text-transform: uppercase;
        }
        .badge-live { background: rgba(16, 185, 129, 0.1); color: var(--live); }
        .badge-dead { background: rgba(239, 68, 68, 0.1); color: var(--dead); }
        .badge-unknown { background: rgba(245, 158, 11, 0.1); color: var(--unknown); }
        
        .row-reason { font-size: 0.85rem; color: var(--muted); }
        .row-details { font-size: 0.85rem; color: #71717a; text-align: right; }

        /* Toast */
        #toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: var(--text); color: var(--bg); padding: 10px 20px;
            border-radius: 20px; font-weight: 600; opacity: 0; transition: 0.3s; pointer-events: none; z-index: 1000;
        }
        #toast.show { opacity: 1; }

        /* Mobile */
        @media (max-width: 600px) {
            .card-row { grid-template-columns: 1fr; gap: 10px; }
            .row-details { text-align: left; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="input-wrapper">
        <textarea id="inputData" placeholder="4111111111111111|12|2025|123&#10;5500000000000004|01/26|456"></textarea>
        <div class="controls">
            <button class="btn-primary" id="analyzeBtn" onclick="runAnalysis()">Analyze</button>
            <button class="btn-secondary" onclick="copyBatch('live')">Copy Live</button>
            <button class="btn-secondary" onclick="copyBatch('dead')">Copy Dead</button>
            <button class="btn-secondary" onclick="copyBatch('unknown')">Copy Unknown</button>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card live"><div class="stat-num" id="cLive">0</div><div class="stat-label">Live</div></div>
        <div class="stat-card dead"><div class="stat-num" id="cDead">0</div><div class="stat-label">Dead</div></div>
        <div class="stat-card unknown"><div class="stat-num" id="cUnknown">0</div><div class="stat-label">Unknown</div></div>
    </div>

    <div class="results-list" id="resultsList"></div>
</div>

<div id="toast">Copied!</div>

<script>
    /* --- Validation Engine --- */
    const BIN_RANGES = {
        '4': [{ start: 40, end: 49, type: 'Visa', length: [13, 16, 19] }],
        '5': [{ start: 50, end: 59, type: 'MC', length: [16] }], // Includes 2-series MC
        '2': [{ start: 2221, end: 2720, type: 'MC 2-Series', length: [16] }],
        '3': [{ start: 34, end: 37, type: 'Amex', length: [15] }],
        '6': [{ start: 6011, end: 6011, type: 'Discover', length: [16] }]
    };

    function parseLine(line) {
        line = line.trim();
        if (!line) return null;
        const p = line.split('|');
        if (p.length < 2) return { raw: line, valid: false, reason: "Bad Format" };
        
        const num = p[0].trim();
        const date = p[1].trim();
        const cvv = p[2] ? p[2].trim() : 'N/A';
        
        let m = '', y = '';
        if (date.includes('/')) {
            [m, y] = date.split('/');
        } else if (p.length > 2) {
            m = p[1].trim();
            y = p[2].trim();
        } else {
            m = date;
        }
        
        // Normalize year (2026 -> 26)
        y = y.replace(/^20/, '');
        
        return { raw: line, num, m, y, cvv };
    }

    function validateNumber(numStr) {
        // Strip non-digits
        numStr = numStr.replace(/\D/g, '');
        if (numStr.length < 12) return { valid: false, reason: "Too Short" };

        // 1. Luhn Check
        if (!luhn(numStr)) return { valid: false, reason: "Luhn Failed" };

        // 2. BIN Check
        const prefix = numStr.substring(0, 4);
        const firstDigit = numStr[0];
        
        let match = null;
        if (BIN_RANGES[firstDigit]) {
            match = BIN_RANGES[firstDigit].find(b => {
                if (prefix.length >= 2 && prefix.length <= 4) {
                    const val = parseInt(prefix);
                    if (val >= b.start && val <= b.end) return b.length.includes(numStr.length);
                }
                return false;
            });
        }

        if (!match) return { valid: false, reason: "Unknown BIN" };

        // 3. Fake Pattern Check
        if (/^0+$/.test(numStr)) return { valid: false, reason: "Fake (Zeros)" };
        if (/^1+$/.test(numStr)) return { valid: false, reason: "Fake (Ones)" };

        return { valid: true, reason: "Luhn Valid", bin: match.type };
    }

    function luhn(str) {
        let sum = 0, alt = false;
        for (let i = str.length - 1; i >= 0; i--) {
            let n = parseInt(str[i]);
            if (alt) { n *= 2; if (n > 9) n -= 9; }
            sum += n;
            alt = !alt;
        }
        return sum % 10 === 0;
    }

    function checkStatus(parsed) {
        const val = validateNumber(parsed.num);
        if (!val.valid) return { ...parsed, status: 'dead', reason: val.reason };

        // Check Expiry
        const now = new Date();
        const exp = new Date(2000 + parseInt(parsed.y || '24'), parseInt(parsed.m) - 1);
        
        if (exp < now) return { ...parsed, status: 'dead', reason: 'Expired' };

        // Simulate Bank Check (Deterministic based on number to avoid flickering)
        // We use a hash of the number to decide fate so results are consistent for the same card
        const hash = [...parsed.num].reduce((a, b) => a + b.charCodeAt(0), 0);
        
        if (hash % 5 === 0) return { ...parsed, status: 'live', reason: 'Approved' };
        if (hash % 5 < 3) return { ...parsed, status: 'dead', reason: 'Declined' };
        
        return { ...parsed, status: 'unknown', reason: 'Unknown' };
    }

    /* --- UI Logic --- */
    let results = [];

    async function runAnalysis() {
        const btn = document.getElementById('analyzeBtn');
        const list = document.getElementById('resultsList');
        btn.disabled = true;
        btn.innerText = "Running...";
        
        list.innerHTML = '';
        results = [];
        
        const lines = document.getElementById('inputData').value.split('\n').filter(l => l.trim());
        const promises = lines.map(l => checkStatus(parseLine(l)));
        const processed = await Promise.all(promises);
        
        processed.forEach(r => {
            results.push(r);
            render(r);
        });
        
        updateStats();
        btn.disabled = false;
        btn.innerText = "Analyze";
    }

    function render(r) {
        const div = document.createElement('div');
        div.className = 'card-row';
        div.onclick = () => copyToClipboard(r.raw);
        
        div.innerHTML = `
            <div class="row-num">${r.num.replace(/(.{4})/g, '$1 ').trim()}</div>
            <div class="row-status">
                <span class="badge badge-${r.status}">${r.status}</span>
                <div class="row-reason">${r.reason}</div>
            </div>
            <div class="row-details">
                ${r.m}/${r.y} <br> ${r.cvv}
            </div>
        `;
        list.prepend(div);
    }

    function updateStats() {
        const counts = { live: 0, dead: 0, unknown: 0 };
        results.forEach(r => counts[r.status]++);
        
        document.getElementById('cLive').innerText = counts.live;
        document.getElementById('cDead').innerText = counts.dead;
        document.getElementById('cUnknown').innerText = counts.unknown;
    }

    function copyToClipboard(text) {
        navigator.clipboard.writeText(text);
        showToast("Copied: " + text);
    }

    function copyBatch(status) {
        const batch = results.filter(r => r.status === status).map(r => r.raw).join('\n');
        if (batch) copyToClipboard(batch);
        else showToast("No " + status + " cards");
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2000);
    }
</script>
</body>
</html>
