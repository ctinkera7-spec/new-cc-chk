<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEON-CARD VALIDATOR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: #0f0f23;
      color: #e2e8f0;
      font-family: 'Segoe UI', sans-serif;
    }
    .card {
      transition: all 0.3s ease;
      border: 2px solid transparent;
      background: rgba(30, 30, 60, 0.7);
      backdrop-filter: blur(10px);
    }
    .card.valid {
      border-color: #10b981;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
    }
    .card.invalid {
      border-color: #ef4444;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
    }
    .emoji {
      font-size: 1.5rem;
    }
    .reason {
      font-size: 0.8rem;
      opacity: 0.9;
    }
  </style>
</head>
<body class="p-6">
  <div class="max-w-6xl mx-auto">
    <h1 class="text-4xl font-bold mb-8 text-center">NEON-CARD VALIDATOR</h1>

    <!-- Filter Controls -->
    <div class="mb-6 flex justify-center">
      <select id="filter" class="bg-gray-800 border border-gray-600 rounded-lg px-4 py-2 text-white">
        <option value="all">All Cards</option>
        <option value="valid">Valid Cards Only</option>
        <option value="invalid">Invalid Cards Only</option>
      </select>
    </div>

    <!-- Cards Container -->
    <div id="cards-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Cards will be injected here by JS -->
    </div>
  </div>

  <script>
    // ========== DATA PROCESSING ==========
    // Hypothetical bank/emoji/state database
    const bankData = {
      "CHASE": { emoji: "🏛️", state: "NY", name: "Chase Bank" },
      "BOFA": { emoji: "🏦", state: "NC", name: "Bank of America" },
      "WELLS FARGO": { emoji: "🐎", state: "CA", name: "Wells Fargo" },
      "CITI": { emoji: "🌆", state: "NY", name: "Citi Bank" },
      "USBANK": { emoji: "🏔️", state: "MN", name: "US Bank" },
      "RBC": { emoji: "🍁", state: "ON", name: "Royal Bank of Canada" },
      "TD": { emoji: "🍁", state: "ON", name: "TD Bank" },
      "UNKNOWN": { emoji: "💳", state: "N/A", name: "Unknown Bank" }
    };

    // Sample pipe-formatted data (replace with your actual data)
    const rawData = `
      VISA|4111111111111111|USA|CHASE
      MASTERCARD|5555555555554444|USA|BOFA
      AMEX|378282246310005|USA|WELLS FARGO
      DISCOVER|6011111111111117|USA|CITI
      VISA|1234567890123456|USA|USBANK
      MASTERCARD|5105105105105100|CANADA|RBC
      VISA|4222222222222|USA|TD
      INVALID|1111111111111111|USA|UNKNOWN
    `;

    // ========== VALIDATION ENGINE ==========
    const validateCard = (card) => {
      // 1. Network Check
      const validNetworks = ["VISA", "MASTERCARD", "AMEX", "DISCOVER"];
      if (!validNetworks.includes(card.network)) {
        return {
          status: "invalid",
          reason: `❌ Invalid network: "${card.network}". Must be one of: ${validNetworks.join(", ")}.`
        };
      }

      // 2. Luhn Algorithm (Credit Card Checksum)
      const luhnCheck = (num) => {
        const digits = num.split("").map(Number);
        const sum = digits.reverse().reduce((acc, digit, index) => {
          if (index % 2 === 1) digit *= 2;
          if (digit > 9) digit -= 9;
          return acc + digit;
        }, 0);
        return sum % 10 === 0;
      };
      if (!luhnCheck(card.number)) {
        return {
          status: "invalid",
          reason: "❌ Invalid card number: Failed Luhn checksum."
        };
      }

      // 3. Country/Bank Match (Hypothetical Rule)
      const countryBankRules = {
        USA: ["CHASE", "BOFA", "WELLS FARGO", "CITI", "USBANK"],
        CANADA: ["RBC", "TD"]
      };
      if (!countryBankRules[card.country]?.includes(card.bank)) {
        return {
          status: "invalid",
          reason: `❌ Bank "${card.bank}" is not valid for country "${card.country}".`
        };
      }

      // Success
      return {
        status: "valid",
        reason: "✅ Card is valid: Network, checksum, and bank/country match confirmed."
      };
    };

    // ========== DATA PARSING ==========
    const parsePipeData = (data) => {
      return data.trim().split("\n").map(line => {
        // Handle all pipe formats (with/without spaces, extra pipes)
        const parts = line.split("|").map(part => part.trim()).filter(part => part);
        return {
          network: parts[0] || "UNKNOWN",
          number: parts[1] || "0000000000000000",
          country: parts[2] || "UNKNOWN",
          bank: parts[3] || "UNKNOWN"
        };
      });
    };

    // ========== CARD RENDERING ==========
    const renderCards = (cards) => {
      const container = document.getElementById("cards-container");
      container.innerHTML = "";

      cards.forEach(card => {
        const bankInfo = bankData[card.bank] || bankData.UNKNOWN;
        const validation = validateCard(card);

        const cardElement = document.createElement("div");
        cardElement.className = `card rounded-xl p-6 ${validation.status}`;
        cardElement.innerHTML = `
          <div class="flex items-center mb-4">
            <span class="emoji mr-3">${bankInfo.emoji}</span>
            <div>
              <h3 class="text-xl font-bold">${card.network}</h3>
              <p class="text-gray-400">${bankInfo.name} (${bankInfo.state})</p>
            </div>
          </div>
          <div class="mb-4">
            <p class="text-2xl font-mono tracking-wider">${card.number.replace(/\d{4}(?=\d)/g, '$& ')}</p>
          </div>
          <div class="border-t border-gray-600 pt-4">
            <p class="font-bold ${validation.status === 'valid' ? 'text-green-400' : 'text-red-400'}">
              ${validation.status.toUpperCase()}
            </p>
            <p class="reason mt-1">${validation.reason}</p>
          </div>
        `;
        container.appendChild(cardElement);
      });
    };

    // ========== FILTER SYSTEM ==========
    document.getElementById("filter").addEventListener("change", (e) => {
      const filter = e.target.value;
      const cards = parsePipeData(rawData);

      if (filter === "valid") {
        renderCards(cards.filter(card => validateCard(card).status === "valid"));
      } else if (filter === "invalid") {
        renderCards(cards.filter(card => validateCard(card).status === "invalid"));
      } else {
        renderCards(cards);
      }
    });

    // ========== INITIAL RENDER ==========
    document.addEventListener("DOMContentLoaded", () => {
      renderCards(parsePipeData(rawData));
    });
  </script>
</body>
</html>
