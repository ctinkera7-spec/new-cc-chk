
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA GATEWAY - Fixed Checker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        body { background-color: #020617; }
        .glass { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(51, 65, 85, 0.5); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        @keyframes pulse-green { 0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); } }
        @keyframes pulse-red { 0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } }
        .live-status { animation: pulse-green 2s infinite; }
        .dead-status { animation: pulse-red 2s infinite; }
        .btn-copy { cursor: pointer; transition: all 0.2s; }
        .btn-copy:active { transform: scale(0.95); }
        .loading-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(2, 6, 23, 0.9); z-index: 50;
            display: none; justify-content: center; align-items: center;
        }
    </style>
</head>
<body class="text-slate-200 font-sans selection:bg-blue-500/30 min-h-screen flex flex-col items-center p-4">

    <div class="w-full max-w-7xl">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8 border-b border-slate-800 pb-6">
            <div>
                <h1 class="text-3xl font-black tracking-tighter text-white uppercase italic">
                    NOVA <span class="text-blue-500 not-italic">GATEWAY</span>
                </h1>
                <p class="text-xs font-mono text-slate-500 mt-1">Secure Terminal // Charge v3.1 (Test Mode)</p>
            </div>
            <div class="flex items-center gap-2 text-xs font-mono text-slate-400 bg-slate-900 px-3 py-1 rounded border border-slate-800">
                <span id="status-dot" class="w-2 h-2 rounded-full bg-slate-600"></span>
                <span id="status-text">IDLE</span>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- Input Section -->
            <div class="lg:col-span-3 space-y-6">
                <div class="glass p-6 rounded-2xl shadow-2xl relative overflow-hidden">
                    <h2 class="text-xs font-bold text-blue-500 uppercase tracking-widest mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-credit-card"></i> Input
                    </h2>
                    
                    <!-- Large Textarea -->
                    <textarea id="inputData" rows="25" 
                        class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm font-mono focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none resize-none text-slate-300"
                        placeholder="444444xxxxxxxxxx|xx|xx|xxx&#10;4111111111111111|12|2024|123&#10;..."></textarea>
                    
                    <div class="flex justify-between items-center mt-4">
                        <button onclick="clearInput()" class="text-xs text-slate-500 hover:text-slate-300 transition"><i class="fa-solid fa-trash"></i> Clear</button>
                        <button onclick="startCheck()" id="startBtn" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2 rounded-lg text-sm font-bold shadow-lg shadow-blue-900/50 transition flex items-center gap-2">
                            <i class="fa-solid fa-bolt"></i> CHECK
                        </button>
                    </div>
                </div>

                <!-- Stats -->
                <div class="grid grid-cols-3 gap-4">
                    <div class="glass p-4 rounded-xl text-center border border-slate-800">
                        <div class="text-xs text-slate-500 uppercase font-bold">Checked</div>
                        <div id="count-total" class="text-xl font-mono text-slate-300">0</div>
                    </div>
                    <div class="glass p-4 rounded-xl text-center border border-green-900/30">
                        <div class="text-xs text-green-500 uppercase font-bold">Approved</div>
                        <div id="count-approve" class="text-xl font-mono text-green-400">0</div>
                    </div>
                    <div class="glass p-4 rounded-xl text-center border border-red-900/30">
                        <div class="text-xs text-red-500 uppercase font-bold">Declined</div>
                        <div id="count-decline" class="text-xl font-mono text-red-400">0</div>
                    </div>
                </div>
            </div>

            <!-- Results Section -->
            <div class="lg:col-span-9">
                <div class="glass rounded-2xl shadow-2xl overflow-hidden border border-slate-800 flex flex-col h-[600px]">
                    <div class="p-4 border-b border-slate-800 bg-slate-900/50 flex justify-between items-center">
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest">Report Log</h3>
                        <button onclick="copyFullReport()" class="text-xs bg-blue-600 hover:bg-blue-500 px-3 py-1 rounded text-white transition shadow-lg shadow-blue-900/50">
                            <i class="fa-solid fa-copy"></i> Copy Full Report
                        </button>
                    </div>
                    
                    <div class="overflow-auto flex-1 relative">
                        <table class="w-full text-left border-collapse">
                            <thead class="bg-slate-900/80 sticky top-0 z-10">
                                <tr>
                                    <th class="p-3 text-[10px] uppercase font-bold text-slate-500 border-b border-slate-800 w-16">Status</th>
                                    <th class="p-3 text-[10px] uppercase font-bold text-slate-500 border-b border-slate-800">Card</th>
                                    <th class="p-3 text-[10px] uppercase font-bold text-slate-500 border-b border-slate-800">Exp</th>
                                    <th class="p-3 text-[10px] uppercase font-bold text-slate-500 border-b border-slate-800">CVV</th>
                                    <th class="p-3 text-[10px] uppercase font-bold text-slate-500 border-b border-slate-800">Message</th>
                                    <th class="p-3 text-[10px] uppercase font-bold text-slate-500 border-b border-slate-800 text-right">VBV</th>
                                </tr>
                            </thead>
                            <tbody id="resultsBody" class="font-mono text-xs">
                                <!-- Rows go here -->
                            </tbody>
                        </table>
                        <div id="loading-spinner" class="absolute inset-0 flex items-center justify-center bg-slate-900/50 hidden">
                            <i class="fa-solid fa-circle-notch fa-spin text-4xl text-blue-500"></i>
                        </div>
                    </div>
                    
                    <!-- Pagination -->
                    <div class="p-3 border-t border-slate-800 bg-slate-900/50 flex justify-between items-center text-xs">
                        <span id="page-info">Showing 0 results</span>
                        <div class="flex gap-2">
                            <button onclick="prevPage()" id="btn-prev" class="px-3 py-1 bg-slate-800 hover:bg-slate-700 rounded disabled:opacity-50">Prev</button>
                            <button onclick="nextPage()" id="btn-next" class="px-3 py-1 bg-slate-800 hover:bg-slate-700 rounded disabled:opacity-50">Next</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // CONFIG - SWITCHED TO TEST MODE FOR BROWSER COMPATIBILITY
        // Test cards: 4242 4242 4242 4242 | Any Exp | Any CVV
        const STRIPE_KEY = 'pk_test_51UBf281ZSkuXSh1ubUYwN9COuhq1ktHXfEtsRlu6AtsOWcS5iPIew9ezHEE1FqEnmtmw8fafsvm9HeFlBsYPbO3800NU78uQjY'; 
        const stripe = Stripe(STRIPE_KEY);

        // UI HELPERS
        const els = {
            input: document.getElementById('inputData'),
            body: document.getElementById('resultsBody'),
            statusText: document.getElementById('status-text'),
            statusDot: document.getElementById('status-dot'),
            counts: {
                total: document.getElementById('count-total'),
                approve: document.getElementById('count-approve'),
                decline: document.getElementById('count-decline')
            },
            btn: document.getElementById('startBtn'),
            spinner: document.getElementById('loading-spinner'),
            prev: document.getElementById('btn-prev'),
            next: document.getElementById('btn-next'),
            pageInfo: document.getElementById('page-info')
        };

        let stats = { total: 0, approve: 0, decline: 0 };
        let allResults = [];
        let currentPage = 1;
        const itemsPerPage = 100;

        function setStatus(state) {
            if(state === 'loading') {
                els.statusText.innerText = 'PROCESSING';
                els.statusDot.className = 'w-2 h-2 rounded-full bg-blue-500 live-status';
                els.spinner.style.display = 'flex';
                els.btn.disabled = true;
            } else if (state === 'error') {
                els.statusText.innerText = 'ERROR';
                els.statusDot.className = 'w-2 h-2 rounded-full bg-red-500 dead-status';
            } else {
                els.statusText.innerText = 'IDLE';
                els.statusDot.className = 'w-2 h-2 rounded-full bg-slate-600';
                els.spinner.style.display = 'none';
                els.btn.disabled = false;
            }
        }

        function clearInput() {
            els.input.value = '';
            els.body.innerHTML = '';
            stats = { total: 0, approve: 0, decline: 0 };
            allResults = [];
            updateStats();
            currentPage = 1;
            updatePagination();
        }

        function updateStats() {
            els.counts.total.innerText = stats.total;
            els.counts.approve.innerText = stats.approve;
            els.counts.decline.innerText = stats.decline;
        }

        // DATA PARSING & FORMATTING
        function parseLine(line) {
            let clean = line.trim();
            if (!clean) return null;

            // Regex to extract parts regardless of separator (pipe, comma, space, dash)
            const parts = clean.split(/[\s,|-]+/);
            const filtered = parts.filter(p => p.length > 0);

            let card = '', exp = '', cvv = '', year = '';

            if (filtered.length >= 4) {
                card = filtered[0];
                exp = filtered[1];
                year = filtered[2]; 
                cvv = filtered[3];
            } else {
                if (filtered[0].length >= 13) card = filtered[0];
            }

            // Validation
            if (!/^\d{13,19}$/.test(card)) return null;
            if (!/^\d{2}$/.test(exp)) return null;
            if (!/^\d{2,4}$/.test(year)) return null; 
            if (!/^\d{3,4}$/.test(cvv)) return null;

            let formattedYear = year;
            if (year.length === 4) formattedYear = year.substring(2);

            return {
                raw: clean,
                card: card,
                exp: `${exp}/${formattedYear}`,
                cvv: cvv,
                month: exp,
                year: formattedYear
            };
        }

        // STRIPE CHECK LOGIC
        async function checkCard(dataObj) {
            try {
                const { token, error } = await stripe.createToken('card', {
                    number: dataObj.card,
                    exp_month: parseInt(dataObj.month),
                    exp_year: parseInt(dataObj.year),
                    cvc: dataObj.cvv
                });

                if (error) {
                    // Log specific error
                    console.error('Stripe Error:', error.message);
                    return { status: 'Declined', msg: error.code || error.message, vbv: 'N/A' };
                }
                
                return { status: 'Approved', msg: 'Token Created', vbv: 'Yes' };

            } catch (err) {
                console.error('Network Error:', err);
                return { status: 'Error', msg: err.message, vbv: 'Unknown' };
            }
        }

        async function startCheck() {
            const rawInput = els.input.value;
            if (!rawInput) return;

            setStatus('loading');
            els.spinner.style.display = 'flex';
            
            const lines = rawInput.split('\n');
            const promises = [];
            stats = { total: 0, approve: 0, decline: 0 };
            allResults = []; // Reset results

            // Parse and Queue
            lines.forEach((line, index) => {
                const data = parseLine(line);
                if (data) {
                    stats.total++;
                    // Add slight delay to avoid rate limiting (100ms per request)
                    const delay = index * 100; 
                    promises.push(new Promise(resolve => {
                        setTimeout(async () => {
                            const result = await checkCard(data);
                            resolve({ data, result });
                        }, Math.min(delay, 2000)); 
                    }));
                }
            });

            // Execute all
            const results = await Promise.all(promises);
            
            // Sort: Approved first
            results.sort((a, b) => {
                if (a.result.status === 'Approved') return -1;
                if (b.result.status === 'Approved') return 1;
                return 0;
            });

            allResults = results;
            
            // Update Stats
            allResults.forEach(res => {
                if (res.result.status === 'Approved') stats.approve++;
                else stats.decline++;
            });
            updateStats();

            // Render First Page
            currentPage = 1;
            renderPage();
            updatePagination();
            setStatus('idle');
            els.btn.innerHTML = '<i class="fa-solid fa-bolt"></i> CHECK AGAIN';
        }

        function renderPage() {
            els.body.innerHTML = '';
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageData = allResults.slice(start, end);

            pageData.forEach(res => {
                const tr = document.createElement('tr');
                tr.className = 'border-b border-slate-800 hover:bg-slate-800/50 transition';
                
                const statusColor = res.result.status === 'Approved' ? 'text-green-400' : (res.result.status === 'Error' ? 'text-yellow-400' : 'text-red-400');
                const statusIcon = res.result.status === 'Approved' ? '<i class="fa-solid fa-check-circle"></i>' : (res.result.status === 'Error' ? '<i class="fa-solid fa-exclamation"></i>' : '<i class="fa-solid fa-xmark"></i>');
                
                tr.innerHTML = `
                    <td class="p-3 border-r border-slate-800/50">
                        <div class="flex items-center gap-2 ${statusColor}">
                            ${statusIcon} <span class="text-[10px] uppercase font-bold tracking-wider">${res.result.status}</span>
                        </div>
                    </td>
                    <td class="p-3 border-r border-slate-800/50 text-slate-300 font-bold">${res.data.card}</td>
                    <td class="p-3 border-r border-slate-800/50 text-slate-400">${res.data.exp}</td>
                    <td class="p-3 border-r border-slate-800/50 text-slate-400">${res.data.cvv}</td>
                    <td class="p-3 border-r border-slate-800/50 text-slate-500 text-[10px] truncate max-w-[100px]">${res.result.msg}</td>
                    <td class="p-3 text-right">
                        <span class="inline-block px-2 py-1 rounded bg-slate-800 border border-slate-700 text-[10px] font-bold ${res.result.vbv === 'Yes' ? 'text-green-400' : 'text-slate-400'}">
                            ${res.result.vbv}
                        </span>
                    </td>
                `;
                els.body.appendChild(tr);
            });
        }

        function updatePagination() {
            const totalPages = Math.ceil(allResults.length / itemsPerPage) || 1;
            els.pageInfo.innerText = `Page ${currentPage} of ${totalPages} (${allResults.length} total)`;
            
            els.prev.disabled = currentPage === 1;
            els.next.disabled = currentPage === totalPages;
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                renderPage();
                updatePagination();
            }
        }

        function nextPage() {
            const totalPages = Math.ceil(allResults.length / itemsPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                renderPage();
                updatePagination();
            }
        }

        // COPY UTILS
        function copyFullReport() {
            let text = '';
            allResults.forEach(res => {
                const pipeString = `${res.data.card}|${res.data.exp}|${res.data.cvv}`;
                text += `${res.result.status}|${pipeString}|${res.result.vbv}\n`;
            });
            
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector('button[onclick="copyFullReport()"]');
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="fa-solid fa-check"></i> COPIED!';
                btn.classList.add('bg-green-600');
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.classList.remove('bg-green-600');
                }, 1000);
            });
        }
    </script>
</body>
</html>
