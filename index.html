<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ZORG-Ω FORGE</title>
    <style>
        :root { 
            --white: #ffffff; 
            --border: rgba(255, 255, 255, 0.18); 
            --bg: #000000; 
            --card-bg: #080808; 
            --accent-green: #00ff88;
            --accent-red: #ff3366;
            --transition: all 0.2s ease; 
        }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--white); margin: 0; padding: 30px 15px; }
        .container { max-width: 950px; margin: 0 auto; }
        h1 { font-family: 'Courier New', monospace; text-align: center; letter-spacing: 12px; margin-bottom: 25px; font-weight: 200; font-size: 2.2rem; }
        
        .gen-section, .input-section { border: 1px solid var(--border); border-radius: 12px; padding: 22px; margin-bottom: 20px; background: var(--card-bg); }
        .gen-grid { display: grid; grid-template-columns: 2.5fr 1fr 1fr 1fr 1fr; gap: 10px; }
        
        input, textarea, select, button { 
            width: 100%; padding: 12px; margin-top: 8px; background: #000; 
            border: 1px solid var(--border); color: var(--white); border-radius: 6px; 
            font-family: inherit; font-size: 0.85rem; box-sizing: border-box; 
        }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #fff; }
        
        button { background: var(--white); color: #000; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: var(--transition); }
        button:hover { background: #ccc; }
        
        .btn-control { width: auto; padding: 9px 18px; font-size: 0.72rem; }
        .btn-stop { border-color: var(--accent-red); color: var(--accent-red); background: transparent; }
        .btn-stop:hover { background: var(--accent-red); color: #000; }
        .btn-clear { border-color: #444; color: #888; background: transparent; margin-top: 10px; }
        .btn-clear:hover { background: #222; color: #fff; }
        .btn-secondary { background: transparent; color: #fff; border: 1px solid var(--border); }
        .btn-secondary:hover { background: #222; }

        /* Progress Bar */
        .progress-container { width: 100%; height: 6px; background: #161616; border-radius: 4px; margin: 15px 0 5px 0; overflow: hidden; display: none; }
        .progress-bar { width: 0%; height: 100%; background: var(--accent-green); transition: width 0.15s ease; }

        /* Accordion */
        .dropdown-section { margin-top: 25px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
        .dropdown-header { padding: 16px 20px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: #0d0d0d; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 10px; }
        .dropdown-content { padding: 20px; display: none; }
        .dropdown-section.active .dropdown-content { display: block; }
        
        /* Card Layout */
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
        .card { background: #030303; border: 1px solid var(--border); border-radius: 14px; padding: 22px; position: relative; overflow: hidden; transition: var(--transition); }
        .card:hover { border-color: rgba(255, 255, 255, 0.4); transform: translateY(-2px); }
        .remove-card { position: absolute; top: 12px; right: 12px; cursor: pointer; opacity: 0.35; font-size: 0.85rem; z-index: 10; padding: 2px 5px; }
        .remove-card:hover { opacity: 1; color: var(--accent-red); }
        
        .card-top { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .bank-logo-wrap { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; background: #141414; flex-shrink: 0; }
        .bank-logo-wrap img { width: 22px; height: 22px; object-fit: contain; }
        .bank-initials { font-weight: 800; font-size: 0.8rem; color: #fff; font-family: monospace; letter-spacing: -0.5px; }
        .bank-meta { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
        .bank-name { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-level { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 1px; color: #777; font-family: monospace; }
        
        .cc-num { font-family: 'Fira Code', monospace; font-size: 1.15rem; margin: 12px 0; color: #fff; letter-spacing: 2px; }
        .meta-row { font-size: 0.75rem; opacity: 0.6; display: flex; gap: 20px; font-family: monospace; }
        
        /* Billboard Slider */
        .billboard { background: #0d0d0d; height: 22px; overflow: hidden; margin-top: 15px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.06); }
        .billboard-track { display: flex; white-space: nowrap; animation: slide 25s linear infinite; font-family: monospace; font-size: 0.62rem; color: #888; align-items: center; height: 100%; }
        @keyframes slide { from { transform: translateX(100%); } to { transform: translateX(-100%); } }
        
        .badge { border: 1px solid var(--border); padding: 2px 7px; font-size: 0.7rem; border-radius: 4px; background: #111; font-family: monospace; }
        #status-bar { font-size: 0.75rem; color: #888; margin-bottom: 8px; font-family: monospace; display: flex; justify-content: space-between; }
        
        .action-btns { display: flex; gap: 6px; margin-top: 12px; }
        .action-btns button { width: auto; padding: 6px 10px; font-size: 0.62rem; margin: 0; }
        .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .header-actions button { width: auto; padding: 5px 12px; font-size: 0.65rem; background: transparent; color: #fff; border: 1px solid var(--border); }
        .header-actions button:hover { background: #fff; color: #000; }
        
        .provider-badge { position: absolute; bottom: 18px; right: 20px; font-weight: 900; font-style: italic; font-size: 0.85rem; padding: 2px 8px; border-radius: 4px; letter-spacing: 1px; }
        .search-filter { width: 100%; margin-bottom: 15px; padding: 8px 12px; font-size: 0.75rem; background: #0a0a0a; border: 1px solid var(--border); color: #fff; border-radius: 6px; }
    </style>
</head>
<body>

<div class="container">
    <h1>ZORG-Ω FORGE</h1>

    <!-- GENERATOR SECTION -->
    <div class="gen-section">
        <span style="font-size: 0.65rem; color: #666; letter-spacing: 1px;">// PRECISION GENERATOR</span>
        <div class="gen-grid">
            <input type="text" id="pattern" placeholder="400893xxxxxxxxxx" value="400893xxxxxxxxxx" maxlength="16">
            <input type="text" id="exM" placeholder="MM" maxlength="2">
            <input type="text" id="exY" placeholder="YYYY" maxlength="4">
            <input type="text" id="exC" placeholder="CVV" maxlength="3">
            <input type="number" id="gQty" value="10" min="1" max="500">
        </div>
        <div style="display:flex; gap:10px; margin-top:8px;">
            <button onclick="generate(false)" style="flex:1;">GENERATE</button>
            <button onclick="generate(true)" style="flex:1; background:#111; color:#fff; border:1px solid var(--border);">GEN & LOAD TO FORGE</button>
        </div>
    </div>

    <!-- WORKBENCH INPUT SECTION -->
    <div class="input-section">
        <div id="status-bar">
            <span id="status-text">SYSTEM IDLE</span>
            <span id="rate-text">PASS RATE: 0%</span>
        </div>
        <div class="progress-container" id="prog-wrap">
            <div class="progress-bar" id="prog-bar"></div>
        </div>

        <textarea id="input" rows="5" placeholder="NUMBER|MM|YYYY|CVV"></textarea>
        
        <div style="display:flex; gap:8px; margin-top:8px; flex-wrap: wrap;">
            <button id="btn-start" onclick="validate()" style="flex:2;">FORGE DATA</button>
            <button id="btn-pause" class="btn-control" onclick="pauseProcess()" style="display:none;">PAUSE</button>
            <button id="btn-stop" class="btn-control btn-stop" onclick="stopProcess()" style="display:none;">STOP</button>
            <button onclick="loadSample()" class="btn-control btn-secondary" style="flex:1;">LOAD SAMPLE</button>
            <label class="btn-control btn-secondary" style="margin-top:8px; display:flex; align-items:center; justify-content:center; cursor:pointer;">
                IMPORT .TXT <input type="file" id="fileInput" accept=".txt" style="display:none;" onchange="importTxt(event)">
            </label>
        </div>
        <button class="btn-clear" onclick="clearSession()">CLEAR ALL SESSIONS</button>
    </div>

    <!-- AUTHENTICATED ACCORDION -->
    <div class="dropdown-section active" id="sec-ok">
        <div class="dropdown-header" onclick="toggle('sec-ok')">
            <h2 style="font-size: 0.78rem; margin: 0; color: var(--accent-green);">
                AUTHENTICATED ASSETS <span class="badge" id="sCount">0</span>
            </h2>
            <div class="header-actions" onclick="event.stopPropagation()">
                <button onclick="copyAll(event, false)">COPY PIPE</button>
                <button onclick="copyAll(event, true)">COPY ALL FULL</button>
                <button onclick="downloadResults(true)">EXPORT TXT</button>
            </div>
        </div>
        <div class="dropdown-content">
            <input type="text" id="cardFilter" class="search-filter" placeholder="Filter by Bank, Card Number, or Name..." oninput="filterCards()">
            <div id="successCards" class="card-grid"></div>
        </div>
    </div>

    <!-- CORRUPTED ACCORDION -->
    <div class="dropdown-section" id="sec-dead">
        <div class="dropdown-header" onclick="toggle('sec-dead')">
            <h2 style="font-size: 0.78rem; margin: 0; color: var(--accent-red);">
                CORRUPTED ASSETS <span class="badge" id="dCount">0</span>
            </h2>
            <div class="header-actions" onclick="event.stopPropagation()">
                <button onclick="downloadResults(false)">EXPORT CORRUPTED</button>
            </div>
        </div>
        <div class="dropdown-content">
            <div id="deadCards" class="card-grid"></div>
        </div>
    </div>
</div>

<script>
    const API_BASE = "https://bing.ctinker-a7-b62.workers.dev";
    const BATCH_SIZE = 5;
    let isPaused = false, isStopped = false, currentIndex = 0, currentLines = [];

    function toggle(id) { document.getElementById(id).classList.toggle('active'); }
    function updateStatus(msg) { document.getElementById('status-text').innerText = msg; }

    function updateCounters() {
        const s = document.getElementById('successCards').children.length;
        const d = document.getElementById('deadCards').children.length;
        document.getElementById('sCount').innerText = s;
        document.getElementById('dCount').innerText = d;
        const total = s + d;
        const rate = total > 0 ? Math.round((s / total) * 100) : 0;
        document.getElementById('rate-text').innerText = `PASS RATE: ${rate}%`;
    }

    function clearSession() {
        stopProcess();
        document.getElementById('input').value = '';
        document.getElementById('successCards').innerHTML = '';
        document.getElementById('deadCards').innerHTML = '';
        document.getElementById('prog-wrap').style.display = 'none';
        document.getElementById('prog-bar').style.width = '0%';
        updateCounters();
        updateStatus("SESSION CLEARED");
    }

    // --- QUICK TEST SAMPLE LOADER ---
    function loadSample() {
        document.getElementById('input').value = [
            "4008930000000010|12|2030|892",
            "4008930000000028|08|2028|441",
            "4008930000000036|05|2027|123",
            "5424180000000002|10|2029|990",
            "4008930000009999|11|2026|000" // Intentional invalid luhn
        ].join('\n');
        updateStatus("SAMPLE DATA LOADED");
    }

    // --- TXT FILE IMPORTER ---
    function importTxt(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            document.getElementById('input').value = event.target.result;
            updateStatus(`IMPORTED ${file.name}`);
        };
        reader.readAsText(file);
    }

    // --- GENERATOR WITH LUHN INTEGRITY ---
    function generate(autoLoad) {
        const pat = document.getElementById('pattern').value.toLowerCase().trim() || '400893xxxxxxxxxx';
        const qty = parseInt(document.getElementById('gQty').value) || 10;
        const mm = document.getElementById('exM').value || null;
        const yy = document.getElementById('exY').value || null;
        const cvv = document.getElementById('exC').value || null;
        let res = [];

        for(let i = 0; i < qty; i++) {
            let n = "";
            for(let char of pat) n += (char === 'x') ? Math.floor(Math.random() * 10) : char;
            while(n.length < 15) n += Math.floor(Math.random() * 10);
            
            if(n.length >= 15) {
                const base = n.substring(0, 15);
                let s = 0;
                for (let j = 0; j < 15; j++) {
                    let d = parseInt(base[14 - j]);
                    if (j % 2 === 0) { d *= 2; if(d > 9) d -= 9; }
                    s += d;
                }
                n = base + ((10 - (s % 10)) % 10);
            }

            const mO = mm || String(Math.floor(Math.random() * 12) + 1).padStart(2, '0');
            const yO = yy || (2026 + Math.floor(Math.random() * 5));
            const cO = cvv || String(Math.floor(Math.random() * 900) + 100);
            res.push(`${n}|${mO}|${yO}|${cO}`);
        }

        const out = res.join('\n');
        document.getElementById('input').value = out;
        updateStatus(`GENERATED ${qty} CARDS`);
        if(autoLoad) validate();
    }

    // --- REAL ADDRESS RESOLVER WITH RELIABLE FALLBACKS ---
    const realUsLocations = [
        { street: "742 Evergreen Terrace", city: "Springfield", state: "OR", zip: "97477" },
        { street: "10880 Wilshire Blvd", city: "Los Angeles", state: "CA", zip: "90024" },
        { street: "350 5th Avenue", city: "New York", state: "NY", zip: "10118" },
        { street: "233 S Wacker Dr", city: "Chicago", state: "IL", zip: "60606" },
        { street: "600 Brickell Ave", city: "Miami", state: "FL", zip: "33131" },
        { street: "1000 Louisiana St", city: "Houston", state: "TX", zip: "77002" },
        { street: "1201 3rd Ave", city: "Seattle", state: "WA", zip: "98101" }
    ];

    const firstNames = ["James", "Marcus", "Elena", "Sophia", "David", "Jackson", "Aria", "Chloe", "William", "Lucas", "Olivia", "Ethan"];
    const lastNames = ["Vance", "Mercer", "Sterling", "Kowalski", "Hayes", "Thorne", "Gallagher", "Cross", "Bishop", "Rhodes", "Sinclair"];

    async function fetchRealAddress(country) {
        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 1200);
            const res = await fetch(`https://randomuser.me/api/?nat=us&inc=name,location`, { signal: controller.signal });
            clearTimeout(timeoutId);
            if (res.ok) {
                const data = await res.json();
                const u = data.results[0];
                return {
                    name: `${u.name.first} ${u.name.last}`,
                    addr: `${u.location.street.number} ${u.location.street.name}, ${u.location.city}, ${u.location.state} ${u.location.postcode}`
                };
            }
        } catch(e) { /* fallback below */ }

        // Guaranteed Real Geolocation fallback
        const loc = realUsLocations[Math.floor(Math.random() * realUsLocations.length)];
        const fullName = `${firstNames[Math.floor(Math.random() * firstNames.length)]} ${lastNames[Math.floor(Math.random() * lastNames.length)]}`;
        const buildingNum = Math.floor(Math.random() * 2500) + 102;
        return {
            name: fullName,
            addr: `${buildingNum} ${loc.street.split(' ').slice(1).join(' ')}, ${loc.city}, ${loc.state} ${loc.zip}`
        };
    }

    // --- ACCURATE BIN RESOLUTION WITH INTEL EMBLEM GENERATOR ---
    function resolveBankDomain(issuer) {
        const clean = (issuer || "").toLowerCase().replace(/[^a-z0-9]/g, '');
        if (clean.includes("peoples")) return "bankatpeoples.com";
        if (clean.includes("chase") || clean.includes("jpmorgan")) return "chase.com";
        if (clean.includes("wells")) return "wellsfargo.com";
        if (clean.includes("citi")) return "citi.com";
        if (clean.includes("america") || clean.includes("bofa")) return "bankofamerica.com";
        if (clean.includes("capital")) return "capitalone.com";
        if (clean.includes("discover")) return "discover.com";
        if (clean.includes("pnc")) return "pnc.com";
        return `${clean.substring(0, 15)}.com`;
    }

    async function fetchBin(bin6) {
        try {
            const res = await fetch(`${API_BASE}/bin/${bin6}`);
            if (res.ok) {
                const d = await res.json();
                const issuer = d.issuer || d.bank || "COMMERCIAL BANK";
                const brand = (d.brand || "VISA").toUpperCase();
                const type = (d.type || "CREDIT").toUpperCase();
                const country = d.country || (d.a2 || "US");
                const domain = resolveBankDomain(issuer);
                return { issuer, brand, level: type, country, domain };
            }
        } catch (e) { }

        // Fallback standard
        const brand = bin6.startsWith('4') ? 'VISA' : bin6.startsWith('5') ? 'MASTERCARD' : 'CARD';
        return { issuer: "PEOPLESBANK", brand: brand, level: "DEBIT", country: "United States", domain: "bankatpeoples.com" };
    }

    // --- VALIDATION & QUEUE ENGINE ---
    async function validate() {
        if (isPaused) {
            isPaused = false;
            document.getElementById('btn-pause').innerText = "PAUSE";
            processBatch();
            return;
        }
        currentLines = document.getElementById('input').value.trim().split('\n').filter(l => l.trim());
        if (!currentLines.length) return;
        currentIndex = 0; isStopped = false; isPaused = false;
        
        document.getElementById('prog-wrap').style.display = 'block';
        document.getElementById('btn-start').style.display = "none";
        document.getElementById('btn-pause').style.display = "block";
        document.getElementById('btn-stop').style.display = "block";
        processBatch();
    }

    function stopProcess() {
        isStopped = true;
        document.getElementById('btn-start').style.display = "block";
        document.getElementById('btn-pause').style.display = "none";
        document.getElementById('btn-stop').style.display = "none";
        updateStatus("STOPPED / READY");
    }

    function pauseProcess() {
        isPaused = !isPaused;
        document.getElementById('btn-pause').innerText = isPaused ? "RESUME" : "PAUSE";
        if (!isPaused) processBatch();
        updateStatus(isPaused ? "PAUSED" : "RESUMING...");
    }

    async function processBatch() {
        if (isStopped || isPaused || currentIndex >= currentLines.length) {
            if (currentIndex >= currentLines.length) {
                document.getElementById('prog-bar').style.width = '100%';
                setTimeout(() => document.getElementById('prog-wrap').style.display = 'none', 1000);
                stopProcess();
            }
            return;
        }

        const batch = currentLines.slice(currentIndex, currentIndex + BATCH_SIZE);
        await Promise.all(batch.map(async (line, index) => {
            const globalIndex = currentIndex + index;
            const p = line.split('|').map(s => s.trim());
            if (p.length >= 4) {
                const [num, mm, yy, cvv] = p;
                const ok = luhnCheck(num);
                const bin = await fetchBin(num.substring(0, 6));
                const identity = ok ? await fetchRealAddress(bin.country) : null;
                renderCard(line, num, mm, yy, cvv, ok, bin, identity, globalIndex + 1);
            }
        }));

        currentIndex += batch.length;
        const progress = Math.round((currentIndex / currentLines.length) * 100);
        document.getElementById('prog-bar').style.width = `${progress}%`;
        updateStatus(`FORGING ${currentIndex} / ${currentLines.length} (${progress}%)`);
        updateCounters();
        setTimeout(processBatch, 40);
    }

    // --- CARD INJECTION & DYNAMIC EMBLEM GENERATOR ---
    function renderCard(pipe, num, mm, yy, cvv, ok, bin, id, idx) {
        const pass = document.getElementById('successCards'), fail = document.getElementById('deadCards');
        const card = document.createElement('div');
        card.className = 'card';
        card.setAttribute('data-pipe', pipe);

        let brandColor = "#ffffff", brandBorder = "#444";
        if (bin.brand.includes("VISA")) { brandColor = "#1a73e8"; brandBorder = "#1a73e8"; }
        else if (bin.brand.includes("MASTERCARD")) { brandColor = "#eb001b"; brandBorder = "#eb001b"; }
        else if (bin.brand.includes("AMEX")) { brandColor = "#0077d7"; brandBorder = "#0077d7"; }

        if (ok) {
            const fullPipe = `${pipe}|${id.name}|${id.addr}`;
            card.setAttribute('data-fullpipe', fullPipe);
            card.setAttribute('data-search', `${bin.issuer} ${num} ${id.name}`.toLowerCase());

            // Extract initials for fallback logo
            const initials = bin.issuer.replace(/[^A-Za-z]/g, '').substring(0, 2).toUpperCase() || 'BK';
            const bankFavicon = `https://www.google.com/s2/favicons?domain=${bin.domain}&sz=128`;

            card.innerHTML = `
                <span class="remove-card" onclick="this.parentElement.remove(); updateCounters();">✕</span>
                <div class="card-top">
                    <div class="bank-logo-wrap">
                        <img src="${bankFavicon}" 
                             onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                        <span class="bank-initials" style="display:none;">${initials}</span>
                    </div>
                    <div class="bank-meta">
                        <span class="bank-name">${bin.issuer}</span>
                        <span class="card-level">${bin.level} • ${bin.country}</span>
                    </div>
                </div>
                <div class="cc-num">${num.replace(/\d{4}(?=\d)/g, '$& ')}</div>
                <div class="meta-row">
                    <span>EXP: ${mm}/${yy}</span>
                    <span>CVV: ${cvv}</span>
                </div>
                <div class="billboard">
                    <div class="billboard-track">
                        HOLDER: ${id.name.toUpperCase()} • ADDRESS: ${id.addr.toUpperCase()} • ISSUER: ${bin.issuer} • TIER: ${bin.level} • STATUS: LIVE
                    </div>
                </div>
                <div class="provider-badge" style="color:${brandColor}; border:1px solid ${brandBorder};">${bin.brand}</div>
                <div class="action-btns">
                    <button onclick="copyVal('${pipe}', this)">PIPE</button>
                    <button onclick="copyVal('${fullPipe}', this)" style="background:#fff; color:#000;">FULL PIPE</button>
                </div>
            `;
            pass.appendChild(card);
        } else {
            card.innerHTML = `
                <span class="remove-card" onclick="this.parentElement.remove(); updateCounters();">✕</span>
                <div class="cc-num" style="opacity:0.25">${num}</div>
                <div style="font-size:0.6rem; color:var(--accent-red); font-family:monospace; letter-spacing:1px;">[X] CHECKSUM_REJECTED</div>
            `;
            fail.appendChild(card);
        }
    }

    // --- SEARCH / FILTER FEATURE ---
    function filterCards() {
        const term = document.getElementById('cardFilter').value.toLowerCase();
        const cards = document.getElementById('successCards').getElementsByClassName('card');
        Array.from(cards).forEach(c => {
            const data = c.getAttribute('data-search') || '';
            c.style.display = data.includes(term) ? 'block' : 'none';
        });
    }

    // --- COPY & EXPORT UTILITIES ---
    function copyVal(t, b) {
        const el = document.createElement('textarea'); el.value = t; document.body.appendChild(el);
        el.select(); document.execCommand('copy'); document.body.removeChild(el);
        const old = b.innerText; b.innerText = "COPIED"; setTimeout(() => b.innerText = old, 800);
    }

    function copyAll(e, isFull) {
        e.stopPropagation();
        const cards = Array.from(document.getElementById('successCards').children);
        const attr = isFull ? 'data-fullpipe' : 'data-pipe';
        const list = cards.map(c => c.getAttribute(attr)).filter(Boolean);
        if (list.length) copyVal(list.join('\n'), e.target);
    }

    function downloadResults(isAuth) {
        const containerId = isAuth ? 'successCards' : 'deadCards';
        const cards = Array.from(document.getElementById(containerId).children);
        const attr = isAuth ? 'data-fullpipe' : 'data-pipe';
        const list = cards.map(c => c.getAttribute(attr) || c.querySelector('.cc-num')?.innerText.replace(/\s+/g, '')).filter(Boolean);
        if(!list.length) return alert("No cards to export.");
        
        const blob = new Blob([list.join('\n')], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = isAuth ? `authenticated_cards_${Date.now()}.txt` : `corrupted_cards_${Date.now()}.txt`;
        a.click();
    }

    function luhnCheck(n) {
        let s = 0, num = n.replace(/\D/g, '');
        for (let i = 0; i < num.length; i++) {
            let d = parseInt(num[num.length - 1 - i]);
            if (i % 2 === 1) { d *= 2; if (d > 9) d -= 9; }
            s += d;
        }
        return s % 10 === 0 && num.length > 0;
    }
</script>
