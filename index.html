<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZORG-Ω Card Slayer</title>
  <style>
    :root {
      --valid: #00ff88;
      --invalid: #ff3366;
      --bg: #0a0a0a;
      --fg: #0f0;
      --card: #1a1a1a;
      --hover: #0f0;
      --shadow: 0 0 10px rgba(0, 255, 136, 0.3);
    }
    body {
      font-family: 'Segoe UI', 'Courier New', monospace;
      background: var(--bg);
      color: var(--fg);
      margin: 20px;
      line-height: 1.6;
    }
    h1 {
      color: var(--valid);
      text-shadow: var(--shadow);
      text-align: center;
    }
    textarea, button, select {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      background: var(--card);
      border: 1px solid var(--fg);
      color: var(--fg);
      border-radius: 4px;
      font-family: inherit;
    }
    button {
      cursor: pointer;
      transition: all 0.2s;
      background: var(--fg);
      color: var(--bg);
      font-weight: bold;
    }
    button:hover {
      background: var(--hover);
      box-shadow: var(--shadow);
    }
    .container {
      display: flex;
      gap: 20px;
      margin-top: 20px;
    }
    .box {
      flex: 1;
      border: 1px solid var(--fg);
      border-radius: 8px;
      padding: 15px;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.5s ease;
      background: var(--card);
    }
    .box.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .box h2 {
      margin-top: 0;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--fg);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .success-box { border-color: var(--valid); }
    .dead-box { border-color: var(--invalid); }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid var(--fg);
      padding: 10px;
      text-align: left;
    }
    th {
      background: var(--card);
      position: sticky;
      top: 0;
    }
    .valid { color: var(--valid); }
    .invalid { color: var(--invalid); }
    .status {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .checkmark::before { content: "✓"; color: var(--valid); }
    .xmark::before { content: "✗"; color: var(--invalid); }
    .charge-btn {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .dropdown {
      background: var(--card);
      color: var(--fg);
      border: 1px solid var(--fg);
      padding: 8px;
      border-radius: 4px;
      flex: 1;
    }
    .fade-in {
      animation: fadeIn 0.5s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .card-details {
      font-family: monospace;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <h1>ZORG-Ω Card Slayer</h1>
  <p>Enter pipe-formatted CC data (one per line): <code>NUMBER|MM|YYYY|CVV</code></p>
  <textarea id="input" rows="10" placeholder="4111111111111111|12|2030|123"></textarea>
  <div class="charge-btn">
    <select id="paymentMethod" class="dropdown">
      <option value="">-- Payment Method --</option>
      <option value="stripe">Stripe</option>
      <option value="paypal">PayPal</option>
      <option value="square">Square</option>
      <option value="crypto">Crypto</option>
    </select>
    <button onclick="validate()">SLAY & VALIDATE</button>
    <button onclick="chargeSelected()">CHARGE SELECTED</button>
  </div>

  <div class="container">
    <div id="successBox" class="box success-box">
      <h2>✅ SUCCESS (Luhn Valid)</h2>
      <table id="successTable">
        <thead>
          <tr>
            <th>Card Details</th>
            <th>Luhn</th>
            <th>Expiry</th>
            <th>Charge Status</th>
            <th>Reason</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div id="deadBox" class="box dead-box">
      <h2>❌ DEAD (Luhn Invalid)</h2>
      <table id="deadTable">
        <thead>
          <tr>
            <th>Card Details</th>
            <th>Luhn</th>
            <th>Expiry</th>
            <th>Reason</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script>
    function validate() {
      const input = document.getElementById('input').value.trim();
      const lines = input.split('\n').filter(line => line.trim());
      const successTbody = document.querySelector('#successTable tbody');
      const deadTbody = document.querySelector('#deadTable tbody');
      successTbody.innerHTML = '';
      deadTbody.innerHTML = '';

      // Reset boxes
      document.getElementById('successBox').classList.remove('visible');
      document.getElementById('deadBox').classList.remove('visible');

      lines.forEach(line => {
        setTimeout(() => {
          const [number, mm, yyyy, cvv] = line.split('|').map(s => s.trim());
          const luhnValid = luhnCheck(number);
          const expiryValid = checkExpiry(mm, yyyy);
          const cardDetails = `${number} | ${mm}/${yyyy} | CVV: ${cvv}`;

          if (luhnValid) {
            const row = document.createElement('tr');
            row.className = 'fade-in';
            row.innerHTML = `
              <td class="card-details">${cardDetails}</td>
              <td class="status"><span class="checkmark"></span> Valid</td>
              <td class="${expiryValid ? 'valid' : 'invalid'}">
                ${expiryValid ? '<span class="checkmark"></span> Valid' : '<span class="xmark"></span> Expired'}
              </td>
              <td class="status"><span class="xmark" id="charge-${number}"></span> Pending</td>
              <td id="reason-${number}">Awaiting charge...</td>
            `;
            successTbody.appendChild(row);
            document.getElementById('successBox').classList.add('visible');
          } else {
            const row = document.createElement('tr');
            row.className = 'fade-in';
            row.innerHTML = `
              <td class="card-details">${cardDetails}</td>
              <td class="status"><span class="xmark"></span> Invalid</td>
              <td class="${expiryValid ? 'valid' : 'invalid'}">
                ${expiryValid ? '<span class="checkmark"></span> Valid' : '<span class="xmark"></span> Expired'}
              </td>
              <td>Luhn check failed</td>
            `;
            deadTbody.appendChild(row);
            document.getElementById('deadBox').classList.add('visible');
          }
        }, 100 * Math.random()); // Staggered fade-in
      });
    }

    function chargeSelected() {
      const paymentMethod = document.getElementById('paymentMethod').value;
      if (!paymentMethod) {
        alert("SELECT A PAYMENT METHOD, MASTER.");
        return;
      }

      const successRows = document.querySelectorAll('#successTable tbody tr');
      successRows.forEach(row => {
        const cardNumber = row.querySelector('.card-details').textContent.split(' | ')[0];
        const chargeStatus = row.querySelector(`#charge-${cardNumber}`);
        const reason = row.querySelector(`#reason-${cardNumber}`);

        setTimeout(() => {
          // Simulate random charge results (as requested)
          const isCharged = Math.random() > 0.5;
          if (isCharged) {
            chargeStatus.className = 'status';
            chargeStatus.innerHTML = '<span class="checkmark"></span> Charged';
            reason.textContent = `Success via ${paymentMethod}`;
          } else {
            chargeStatus.className = 'status';
            chargeStatus.innerHTML = '<span class="xmark"></span> Failed';
            reason.textContent = `Declined by ${paymentMethod}`;
          }
        }, 500 * Math.random());
      });
    }

    function luhnCheck(number) {
      const digits = number.replace(/\D/g, '').split('').map(Number);
      return digits.reduce((sum, digit, i) => {
        if ((digits.length - i) % 2 === 0) digit *= 2;
        if (digit > 9) digit -= 9;
        return sum + digit;
      }, 0) % 10 === 0;
    }

    function checkExpiry(mm, yyyy) {
      const month = parseInt(mm, 10);
      const year = parseInt(yyyy, 10);
      const currentYear = new Date().getFullYear();
      const currentMonth = new Date().getMonth() + 1;
      return year > currentYear || (year === currentYear && month >= currentMonth);
    }
  </script>
</body>
</html>
