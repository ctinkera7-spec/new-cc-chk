<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZORG-Ω Card Slayer</title>
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    :root {
      --valid: #00ff88;
      --invalid: #ff3366;
      --bg: #0a0a0a;
      --fg: #0f0;
      --card: #1a1a1a;
      --hover: #0f0;
      --shadow: 0 0 10px rgba(0, 255, 136, 0.3);
    }
    body {
      font-family: 'Segoe UI', 'Courier New', monospace;
      background: var(--bg);
      color: var(--fg);
      margin: 20px;
      line-height: 1.6;
    }
    h1 {
      color: var(--valid);
      text-shadow: var(--shadow);
      text-align: center;
    }
    textarea, button, select {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      background: var(--card);
      border: 1px solid var(--fg);
      color: var(--fg);
      border-radius: 4px;
      font-family: inherit;
    }
    button {
      cursor: pointer;
      transition: all 0.2s;
      background: var(--fg);
      color: var(--bg);
      font-weight: bold;
    }
    button:hover {
      background: var(--hover);
      box-shadow: var(--shadow);
    }
    .container {
      display: flex;
      gap: 20px;
      margin-top: 20px;
    }
    .box {
      flex: 1;
      border: 1px solid var(--fg);
      border-radius: 8px;
      padding: 15px;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.5s ease;
      background: var(--card);
    }
    .box.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .box h2 {
      margin-top: 0;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--fg);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .success-box { border-color: var(--valid); }
    .dead-box { border-color: var(--invalid); }
    .card {
      background: var(--card);
      border: 1px solid var(--fg);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      transition: all 0.3s;
      opacity: 0;
    }
    .card.visible {
      opacity: 1;
    }
    .card:hover {
      box-shadow: var(--shadow);
    }
    .card-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }
    .card-status {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .checkmark::before { content: "✓"; color: var(--valid); }
    .xmark::before { content: "✗"; color: var(--invalid); }
    .charge-btn {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .dropdown {
      background: var(--card);
      color: var(--fg);
      border: 1px solid var(--fg);
      padding: 8px;
      border-radius: 4px;
      flex: 1;
    }
    .fade-in {
      animation: fadeIn 0.5s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <h1>ZORG-Ω Card Slayer</h1>
  <p>Enter pipe-formatted CC data (one per line): <code>NUMBER|MM|YYYY|CVV</code></p>
  <textarea id="input" rows="10" placeholder="4111111111111111|12|2030|123"></textarea>
  <div class="charge-btn">
    <select id="chargeMethod" class="dropdown">
      <option value="fake">Fake Charge (Simulated)</option>
      <option value="stripe">Stripe (Real Charge)</option>
    </select>
    <button onclick="validate()">SLAY & VALIDATE</button>
  </div>

  <div class="container">
    <div id="successBox" class="box success-box">
      <h2>✅ SUCCESS (Luhn Valid)</h2>
      <div id="successCards"></div>
    </div>

    <div id="deadBox" class="box dead-box">
      <h2>❌ DEAD (Luhn Invalid)</h2>
      <div id="deadCards"></div>
    </div>
  </div>

  <script>
    // Stripe.js initialization
    const stripe = Stripe('pk_live_51NMHTlLvIw0k1EPu80ivQ0HYQ9NUotEncPEpUYYytP8YkUPB4vNGYICv1rB5Emf6nD1UzKXd0wKzdXnumGJqYPDt00Huwrpsfq');
    let paymentMethods = [];

    function validate() {
      const input = document.getElementById('input').value.trim();
      const lines = input.split('\n').filter(line => line.trim());
      const successCards = document.getElementById('successCards');
      const deadCards = document.getElementById('deadCards');
      successCards.innerHTML = '';
      deadCards.innerHTML = '';

      // Reset boxes
      document.getElementById('successBox').classList.remove('visible');
      document.getElementById('deadBox').classList.remove('visible');

      lines.forEach((line, index) => {
        setTimeout(() => {
          const [number, mm, yyyy, cvv] = line.split('|').map(s => s.trim());
          const luhnValid = luhnCheck(number);
          const expiryValid = checkExpiry(mm, yyyy);

          if (luhnValid) {
            const card = document.createElement('div');
            card.className = 'card fade-in';
            card.innerHTML = `
              <div class="card-details">
                <div><strong>Number:</strong> ${number.replace(/\d{4}(?=\d)/g, '$& ')}</div>
                <div><strong>Expiry:</strong> ${mm}/${yyyy}</div>
                <div><strong>CVV:</strong> ${cvv}</div>
              </div>
              <div class="card-status">
                <div class="status"><span class="checkmark"></span> Luhn Valid</div>
                <div class="status ${expiryValid ? 'valid' : 'invalid'}">
                  ${expiryValid ? '<span class="checkmark"></span> Expiry Valid' : '<span class="xmark"></span> Expired'}
                </div>
                <div class="status" id="charge-status-${number}"><span class="xmark"></span> Pending</div>
              </div>
              <div id="charge-reason-${number}">Awaiting charge...</div>
              <button onclick="chargeCard('${number}', '${mm}', '${yyyy}', '${cvv}')">CHARGE</button>
            `;
            successCards.appendChild(card);
            document.getElementById('successBox').classList.add('visible');
            card.classList.add('visible');
          } else {
            const card = document.createElement('div');
            card.className = 'card fade-in';
            card.innerHTML = `
              <div class="card-details">
                <div><strong>Number:</strong> ${number.replace(/\d{4}(?=\d)/g, '$& ')}</div>
                <div><strong>Expiry:</strong> ${mm}/${yyyy}</div>
                <div><strong>CVV:</strong> ${cvv}</div>
              </div>
              <div class="card-status">
                <div class="status"><span class="xmark"></span> Luhn Invalid</div>
                <div class="status ${expiryValid ? 'valid' : 'invalid'}">
                  ${expiryValid ? '<span class="checkmark"></span> Expiry Valid' : '<span class="xmark"></span> Expired'}
                </div>
              </div>
              <div>Reason: Luhn check failed</div>
            `;
            deadCards.appendChild(card);
            document.getElementById('deadBox').classList.add('visible');
            card.classList.add('visible');
          }
        }, 100 * index);
      });
    }

    async function chargeCard(number, mm, yyyy, cvv) {
      const chargeMethod = document.getElementById('chargeMethod').value;
      const chargeStatus = document.getElementById(`charge-status-${number}`);
      const chargeReason = document.getElementById(`charge-reason-${number}`);

      if (chargeMethod === 'fake') {
        // Simulate random charge results
        const isCharged = Math.random() > 0.5;
        if (isCharged) {
          chargeStatus.innerHTML = '<span class="checkmark"></span> Charged';
          chargeReason.textContent = 'Fake charge successful';
        } else {
          chargeStatus.innerHTML = '<span class="xmark"></span> Failed';
          chargeReason.textContent = 'Fake charge declined';
        }
      } else if (chargeMethod === 'stripe') {
        // Real Stripe charge
        chargeStatus.innerHTML = '<span class="xmark"></span> Processing...';
        chargeReason.textContent = 'Contacting Stripe...';

        try {
          const paymentMethod = await stripe.createPaymentMethod({
            type: 'card',
            card: {
              number: number,
              exp_month: mm,
              exp_year: yyyy,
              cvc: cvv,
            },
          });

          if (paymentMethod.error) {
            chargeStatus.innerHTML = '<span class="xmark"></span> Failed';
            chargeReason.textContent = paymentMethod.error.message;
          } else {
            paymentMethods.push(paymentMethod.paymentMethod.id);
            chargeStatus.innerHTML = '<span class="checkmark"></span> Charged';
            chargeReason.textContent = 'Stripe charge successful';
          }
        } catch (error) {
          chargeStatus.innerHTML = '<span class="xmark"></span> Failed';
          chargeReason.textContent = error.message;
        }
      }
    }

    function luhnCheck(number) {
      const digits = number.replace(/\D/g, '').split('').map(Number);
      return digits.reduce((sum, digit, i) => {
        if ((digits.length - i) % 2 === 0) digit *= 2;
        if (digit > 9) digit -= 9;
        return sum + digit;
      }, 0) % 10 === 0;
    }

    function checkExpiry(mm, yyyy) {
      const month = parseInt(mm, 10);
      const year = parseInt(yyyy, 10);
      const currentYear = new Date().getFullYear();
      const currentMonth = new Date().getMonth() + 1;
      return year > currentYear || (year === currentYear && month >= currentMonth);
    }
  </script>
</body>
</html>
