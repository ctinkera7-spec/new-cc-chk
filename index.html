
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA GATEWAY - Fixed Buttons</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- REPLACE WITH YOUR NEW TOKEN -->
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        body { background-color: #020617; }
        .glass { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(51, 65, 85, 0.5); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        @keyframes pulse-green { 0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); } }
        @keyframes pulse-red { 0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } }
        @keyframes pulse-yellow { 0%, 100% { box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.4); } }
        .live-status { animation: pulse-green 2s infinite; }
        .dead-status { animation: pulse-red 2s infinite; }
        .btn-copy { cursor: pointer; transition: all 0.2s; }
        .btn-copy:active { transform: scale(0.95); }
        .loading-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(2, 6, 23, 0.9); z-index: 50;
            display: none; justify-content: center; align-items: center;
        }
        .log-entry { font-size: 0.75rem; margin-bottom: 2px; word-break: break-all; }
        .log-live { color: #4ade80; }
        .log-dead { color: #f87171; }
        .log-err { color: #fbbf24; }
        .log-invalid { color: #94a3b8; }
        .countdown-bar {
            height: 4px; background: #3b82f6; width: 100%;
            transform-origin: left;
            transition: transform 5s linear;
        }
    </style>
</head>
<body class="text-slate-200 font-sans selection:bg-blue-500/30 min-h-screen flex flex-col items-center p-4">

    <div class="w-full max-w-7xl">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8 border-b border-slate-800 pb-6">
            <div>
                <h1 class="text-3xl font-black tracking-tighter text-white uppercase italic">
                    NOVA <span class="text-blue-500 not-italic">GATEWAY</span>
                </h1>
                <p class="text-xs font-mono text-slate-500 mt-1">Secure Terminal // Luhn & Auto-Charge v5.0 (Debug Mode)</p>
            </div>
            <div class="flex items-center gap-2 text-xs font-mono text-slate-400 bg-slate-900 px-3 py-1 rounded border border-slate-800">
                <span id="status-dot" class="w-2 h-2 rounded-full bg-slate-600"></span>
                <span id="status-text">IDLE</span>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- Input Section -->
            <div class="lg:col-span-3 space-y-6">
                <div class="glass p-6 rounded-2xl shadow-2xl relative overflow-hidden">
                    <h2 class="text-xs font-bold text-blue-500 uppercase tracking-widest mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-credit-card"></i> Input
                    </h2>
                    
                    <textarea id="inputData" rows="15" 
                        class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm font-mono focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none resize-none text-slate-300 mb-4"
                        placeholder="444444xxxxxxxxxx|12|2025|123&#10;..."></textarea>
                    
                    <div class="flex justify-between items-center mb-4">
                        <button onclick="clearInput()" class="text-xs text-slate-500 hover:text-slate-300 transition"><i class="fa-solid fa-trash"></i> Clear</button>
                    </div>

                    <!-- Phase 1 Controls -->
                    <div class="mb-4">
                        <button onclick="startCheck()" id="startBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-lg shadow-blue-900/50 transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-magnifying-glass"></i> VERIFY & LUHN
                        </button>
                    </div>

                    <!-- Auto Charge Indicator -->
                    <div id="chargeIndicator" class="hidden mb-4">
                        <div class="flex justify-between text-xs text-yellow-500 mb-1 font-mono">
                            <span>AUTO-CHARGE IN</span>
                            <span id="timerText">5s</span>
                        </div>
                        <div class="w-full bg-slate-800 rounded-full h-1">
                            <div id="progressBar" class="bg-yellow-500 h-1 rounded-full" style="width: 100%"></div>
                        </div>
                    </div>

                    <!-- Phase 2 Controls -->
                    <div class="space-y-3">
                        <label class="text-xs font-bold text-slate-400 uppercase">Charge Amount (USD)</label>
                        <div class="relative">
                            <span class="absolute left-3 top-2.5 text-slate-500">$</span>
                            <input type="number" id="chargeAmount" value="1.00" step="0.01" 
                                class="w-full bg-slate-900 border border-slate-700 rounded-lg pl-6 pr-3 py-2 text-sm text-white focus:border-blue-500 outline-none">
                        </div>
                        <button onclick="startCharge()" id="chargeBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-lg shadow-emerald-900/50 transition flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                            <i class="fa-solid fa-bolt"></i> CHARGE (SIM)
                        </button>
                    </div>
                </div>
            </div>

            <!-- Output Section -->
            <div class="lg:col-span-9 flex flex-col gap-6">
                <div class="glass p-6 rounded-2xl shadow-2xl flex-1 flex flex-col h-[600px]">
                    <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-2">
                        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest flex items-center gap-2">
                            <i class="fa-solid fa-terminal"></i> Console
                        </h2>
                        <div class="text-xs text-slate-500 font-mono">
                            <span id="liveCount">0</span> Live | 
                            <span id="invalidCount">0</span> Invalid | 
                            <span id="totalCount">0</span> Total
                        </div>
                    </div>
                    
                    <div id="outputLog" class="flex-1 overflow-y-auto font-mono p-2 space-y-1">
                        <div class="text-slate-600 italic text-sm text-center mt-10">Ready for input...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // REPLACE THIS WITH YOUR NEW TOKEN
        const stripe = Stripe('YOUR_NEW_TOKEN_HERE');
        
        const outputLog = document.getElementById('outputLog');
        const statusText = document.getElementById('status-text');
        const statusDot = document.getElementById('status-dot');
        const liveCountEl = document.getElementById('liveCount');
        const invalidCountEl = document.getElementById('invalidCount');
        const totalCountEl = document.getElementById('totalCount');
        const chargeIndicator = document.getElementById('chargeIndicator');
        const progressBar = document.getElementById('progressBar');
        const timerText = document.getElementById('timerText');
        const chargeBtn = document.getElementById('chargeBtn');
        const startBtn = document.getElementById('startBtn');

        let liveCards = [];
        let totalProcessed = 0;
        let isCharging = false;

        // Luhn Algorithm
        function luhnCheck(cardNumber) {
            let sum = 0;
            let isEven = false;
            for (let i = cardNumber.length - 1; i >= 0; i--) {
                let digit = parseInt(cardNumber[i]);
                if (isEven) {
                    digit *= 2;
                    if (digit > 9) digit -= 9;
                }
                sum += digit;
                isEven = !isEven;
            }
            return sum % 10 === 0;
        }

        function updateStatus(status) {
            statusText.innerText = status;
            statusDot.className = "w-2 h-2 rounded-full ";
            if(status === 'PROCESSING') {
                statusDot.classList.add('bg-blue-500', 'live-status');
            } else if (status === 'CHARGING') {
                statusDot.classList.add('bg-yellow-500');
                statusText.classList.add('text-yellow-500');
            } else {
                statusDot.classList.add('bg-slate-600');
                statusText.classList.remove('text-blue-500', 'text-yellow-500');
            }
        }

        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `log-entry ${type === 'live' ? 'log-live' : type === 'dead' ? 'log-dead' : type === 'error' ? 'log-err' : type === 'invalid' ? 'log-invalid' : 'text-slate-400'}`;
            const time = new Date().toLocaleTimeString();
            div.innerHTML = `<span class="opacity-50">[${time}]</span> ${message}`;
            outputLog.appendChild(div);
            outputLog.scrollTop = outputLog.scrollHeight;
        }

        function clearInput() {
            document.getElementById('inputData').value = '';
            outputLog.innerHTML = '<div class="text-slate-600 italic text-sm text-center mt-10">Ready for input...</div>';
            liveCards = [];
            totalProcessed = 0;
            liveCountEl.innerText = '0';
            invalidCountEl.innerText = '0';
            totalCountEl.innerText = '0';
            chargeIndicator.classList.add('hidden');
            chargeBtn.disabled = true;
            isCharging = false;
            updateStatus('IDLE');
        }

        function parseCards(text) {
            if (!text) return [];
            return text.trim().split(/\n/).map(line => line.trim()).filter(line => line);
        }

        // PHASE 1: VERIFICATION
        async function startCheck() {
            // Debug: Check if button is disabled
            if(startBtn.disabled) {
                log('Start Button is already disabled or processing.', 'error');
                return;
            }

            const text = document.getElementById('inputData').value;
            const cards = parseCards(text);
            
            if (cards.length === 0) {
                log('No cards found in input.', 'error');
                return;
            }

            updateStatus('PROCESSING');
            let liveFound = 0;
            let invalidFound = 0;
            totalProcessed = cards.length;
            chargeIndicator.classList.add('hidden');
            chargeBtn.disabled = true;
            startBtn.disabled = true; // Disable start button while processing

            for (let i = 0; i < cards.length; i++) {
                const raw = cards[i];
                const parts = raw.split('|');
                
                if (parts.length < 4) {
                    log(`${raw} <span class="log-invalid">INVALID FORMAT</span>`);
                    continue;
                }

                const number = parts[0].replace(/\s/g, '');
                const exp = parts[1];
                const year = parts[2];
                const cvv = parts[3];

                // Luhn Check
                if (!luhnCheck(number)) {
                    log(`${raw} <span class="log-invalid">INVALID (LUHN)</span>`);
                    invalidFound++;
                    invalidCountEl.innerText = invalidFound;
                    totalCountEl.innerText = i + 1;
                    continue;
                }

                // Format expiry
                let expiry = '';
                if (exp.length === 2 && year.length === 4) {
                    expiry = exp + year.slice(-2);
                } else if (exp.length === 4) {
                    expiry = exp;
                } else {
                    expiry = exp + '2' + year;
                }

                try {
                    const { paymentMethod, error } = await stripe.createPaymentMethod({
                        type: 'card',
                        card: {
                            number: number,
                            exp_month: parseInt(exp.length === 2 ? exp : exp.substring(0,2)),
                            exp_year: parseInt(year.length === 4 ? year : year.substring(2)),
                            cvc: cvv
                        }
                    });

                    if (error) {
                        log(`${raw} <span class="log-dead">DEAD</span> - ${error.message}`);
                    } else {
                        log(`${raw} <span class="log-live">LIVE</span> (${paymentMethod.card.brand || 'CARD'})`);
                        liveFound++;
                        liveCards.push({
                            pm_id: paymentMethod.id,
                            number: number,
                            exp: expiry,
                            cvv: cvv
                        });
                    }
                } catch (e) {
                    log(`${raw} <span class="log-err">ERROR</span> - ${e.message}`);
                }

                liveCountEl.innerText = liveFound;
                invalidCountEl.innerText = invalidFound;
                totalCountEl.innerText = i + 1;
                
                await new Promise(r => setTimeout(r, 50)); 
            }

            startBtn.disabled = false; // Re-enable start button

            // Start Auto Charge Phase
            if (liveCards.length > 0) {
                startAutoCharge(5);
            } else {
                updateStatus('IDLE');
                log(`Phase 1 Complete. No Live cards found.`, 'info');
            }
        }

        // PHASE 2: CHARGE
        function startAutoCharge(seconds) {
            updateStatus('WAITING');
            chargeIndicator.classList.remove('hidden');
            chargeBtn.disabled = false; // Enable manual charge too
            chargeBtn.innerHTML = `<i class="fa-solid fa-bolt"></i> AUTO-CHARGE IN ${seconds}s`;
            
            let remaining = seconds;
            const interval = setInterval(() => {
                remaining--;
                if (remaining <= 0) {
                    clearInterval(interval);
                    progressBar.style.transition = 'none';
                    progressBar.style.width = '0%';
                    timerText.innerText = '0s';
                    log('Starting Charge Phase...', 'live');
                    startCharge();
                } else {
                    timerText.innerText = `${remaining}s`;
                    progressBar.style.width = `${(remaining / seconds) * 100}%`;
                }
            }, 1000);
        }

        async function startCharge() {
            if (isCharging) return;
            isCharging = true;
            chargeBtn.disabled = true;
            
            const amountInput = document.getElementById('chargeAmount');
            const amountFloat = parseFloat(amountInput.value);
            
            if (isNaN(amountFloat) || amountFloat <= 0) {
                log('Invalid amount.', 'error');
                updateStatus('IDLE');
                isCharging = false;
                return;
            }

            if (liveCards.length === 0) {
                log('No live cards to charge.', 'error');
                updateStatus('IDLE');
                isCharging = false;
                return;
            }

            updateStatus('CHARGING');
            log(`Charging $${amountFloat} to ${liveCards.length} cards (Simulated)...`, 'info');

            for (let pm of liveCards) {
                await processCharge(pm.pm_id, amountFloat);
                await new Promise(r => setTimeout(r, 150)); // Small delay between charges
            }

            updateStatus('IDLE');
            isCharging = false;
            log(`Charge phase complete.`, 'info');
            chargeIndicator.classList.add('hidden');
            chargeBtn.disabled = true;
            chargeBtn.innerHTML = `<i class="fa-solid fa-bolt"></i> CHARGE (SIM)`;
        }

        async function processCharge(pmId, amount) {
            try {
                // Simulate API call delay
                await new Promise(r => setTimeout(r, 200));
                
                // Simulate success
                log(`$${amount} -> <span class="text-green-400">APPROVED</span> (${pmId.substring(0,8)})`, 'live');

            } catch (e) {
                log(`$${amount} -> <span class="text-red-400">FAILED</span>`, 'dead');
            }
        }

    </script>
</body>
</html>
