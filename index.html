
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA GATEWAY - Card Processor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Load Stripe JS -->
    <script src="https://js.stripe.com/v3/"></script>
    
    <style>
        body { background-color: #020617; }
        .glass { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(51, 65, 85, 0.5); }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        
        /* Animations */
        @keyframes pulse-green { 0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); } }
        @keyframes pulse-red { 0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } }
        .live-status { animation: pulse-green 2s infinite; }
        .dead-status { animation: pulse-red 2s infinite; }
        
        .input-group:focus-within { border-color: #3b82f6; box-shadow: 0 0 0 1px #3b82f6; }
    </style>
</head>
<body class="text-slate-200 font-sans selection:bg-blue-500/30 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-4xl">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8 border-b border-slate-800 pb-6">
            <div>
                <h1 class="text-3xl font-black tracking-tighter text-white uppercase italic">
                    NOVA <span class="text-blue-500 not-italic">GATEWAY</span>
                </h1>
                <p class="text-xs font-mono text-slate-500 mt-1">Secure Terminal // Charge v2.5</p>
            </div>
            <div class="flex items-center gap-2 text-xs font-mono text-slate-400 bg-slate-900 px-3 py-1 rounded border border-slate-800">
                <span id="status-dot" class="w-2 h-2 rounded-full bg-slate-600"></span>
                <span id="status-text">IDLE</span>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Input Section -->
            <div class="lg:col-span-2 space-y-6">
                <div class="glass p-6 rounded-2xl shadow-2xl relative overflow-hidden">
                    <div class="absolute top-0 right-0 p-4 opacity-10">
                        <i class="fa-brands fa-cc-visa text-6xl"></i>
                    </div>

                    <h2 class="text-xs font-bold text-blue-500 uppercase tracking-widest mb-6 flex items-center gap-2">
                        <i class="fa-solid fa-credit-card"></i> Card Details
                    </h2>

                    <div class="space-y-4">
                        <!-- Card Number -->
                        <div class="input-group relative transition-all duration-300 rounded-xl border border-slate-700 bg-slate-950 p-3">
                            <label class="block text-[10px] text-slate-500 mb-1 ml-1 uppercase font-bold">Card Number</label>
                            <div class="flex items-center gap-3">
                                <i class="fa-solid fa-barcode text-slate-600 text-sm"></i>
                                <input type="text" id="cardNumber" placeholder="0000 0000 0000 0000" 
                                    class="w-full bg-transparent outline-none text-sm font-mono text-slate-200 placeholder-slate-600" maxlength="19">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <!-- Expiry -->
                            <div class="input-group relative transition-all duration-300 rounded-xl border border-slate-700 bg-slate-950 p-3">
                                <label class="block text-[10px] text-slate-500 mb-1 ml-1 uppercase font-bold">Expiry</label>
                                <div class="flex items-center gap-3">
                                    <i class="fa-regular fa-calendar text-slate-600 text-sm"></i>
                                    <input type="text" id="cardExpiry" placeholder="MM/YY" 
                                        class="w-full bg-transparent outline-none text-sm font-mono text-slate-200 placeholder-slate-600" maxlength="5">
                                </div>
                            </div>

                            <!-- CVC -->
                            <div class="input-group relative transition-all duration-300 rounded-xl border border-slate-700 bg-slate-950 p-3">
                                <label class="block text-[10px] text-slate-500 mb-1 ml-1 uppercase font-bold">CVC</label>
                                <div class="flex items-center gap-3">
                                    <i class="fa-solid fa-lock text-slate-600 text-sm"></i>
                                    <input type="text" id="cardCvc" placeholder="123" 
                                        class="w-full bg-transparent outline-none text-sm font-mono text-slate-200 placeholder-slate-600" maxlength="4">
                                </div>
                            </div>
                        </div>

                        <!-- Zip -->
                        <div class="input-group relative transition-all duration-300 rounded-xl border border-slate-700 bg-slate-950 p-3">
                            <label class="block text-[10px] text-slate-500 mb-1 ml-1 uppercase font-bold">Zip / Postal Code</label>
                            <div class="flex items-center gap-3">
                                <i class="fa-solid fa-map-pin text-slate-600 text-sm"></i>
                                <input type="text" id="cardZip" placeholder="10001" 
                                    class="w-full bg-transparent outline-none text-sm font-mono text-slate-200 placeholder-slate-600" maxlength="10">
                            </div>
                        </div>
                    </div>

                    <!-- Charge Amount -->
                    <div class="mt-6 flex items-end gap-4">
                        <div class="flex-1 input-group rounded-xl border border-slate-700 bg-slate-950 p-3">
                            <label class="block text-[10px] text-slate-500 mb-1 ml-1 uppercase font-bold">Charge Amount ($)</label>
                            <div class="flex items-center gap-3">
                                <i class="fa-solid fa-dollar-sign text-slate-600 text-sm"></i>
                                <input type="number" id="chargeAmt" value="0.50" step="0.01" 
                                    class="w-full bg-transparent outline-none text-sm font-mono text-emerald-400 font-bold">
                            </div>
                        </div>
                        <button id="chargeBtn" onclick="processCharge()" 
                            class="bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white font-bold py-3 px-8 rounded-xl shadow-lg shadow-blue-900/20 transition-all transform active:scale-95 flex items-center gap-2">
                            <i class="fa-solid fa-bolt"></i> CHARGE
                        </button>
                    </div>
                </div>

                <!-- Logs / Results Area -->
                <div class="glass p-4 rounded-2xl border border-slate-800 h-48 overflow-y-auto" id="logContainer">
                    <div class="text-xs font-mono text-slate-500 mb-2">> SYSTEM LOG</div>
                    <div id="logContent" class="space-y-1 text-xs font-mono">
                        <div class="text-slate-600">> Waiting for input...</div>
                    </div>
                </div>
            </div>

            <!-- Sidebar / Info -->
            <div class="lg:col-span-1 space-y-6">
                <div class="glass p-6 rounded-2xl border border-slate-800">
                    <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Configuration</h2>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-[9px] text-slate-500 mb-1 uppercase font-bold">Mode</label>
                            <div class="bg-slate-950 border border-slate-700 rounded-lg p-2 flex items-center gap-2 text-xs font-mono text-blue-400">
                                <i class="fa-solid fa-shield-halved"></i> TEST MODE
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-[9px] text-slate-500 mb-1 uppercase font-bold">Gateway</label>
                            <div class="bg-slate-950 border border-slate-700 rounded-lg p-2 flex items-center gap-2 text-xs font-mono text-slate-300">
                                <i class="fa-brands fa-stripe"></i> Stripe.js
                            </div>
                        </div>
                    </div>

                    <div class="mt-8 p-4 bg-slate-900/50 rounded-xl border border-slate-800/50">
                        <h3 class="text-[10px] text-slate-500 uppercase font-bold mb-2">Current Status</h3>
                        <div id="resultBadge" class="inline-block px-3 py-1 rounded-full bg-slate-800 text-xs font-bold text-slate-400 border border-slate-700">
                            READY
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ---------------------------------------------------------
        // CONFIGURATION
        // ---------------------------------------------------------
        // 1. Go to Stripe Dashboard -> Developers -> API Keys
        // 2. Copy the "Publishable Key" (starts with pk_test_...)
        // 3. Paste it below inside the quotes.
        const STRIPE_PUBLIC_KEY = "pk_test_YOUR_KEY_HERE"; 

        // ---------------------------------------------------------
        // UI HELPERS
        // ---------------------------------------------------------
        const logContainer = document.getElementById('logContent');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const resultBadge = document.getElementById('resultBadge');
        const chargeBtn = document.getElementById('chargeBtn');

        function addLog(msg, type = 'info') {
            const div = document.createElement('div');
            div.className = `text-[10px] leading-tight ${type === 'error' ? 'text-red-400' : type === 'success' ? 'text-emerald-400' : 'text-slate-400'}`;
            div.innerText = `> ${msg}`;
            logContainer.appendChild(div);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function setStatus(status, color) {
            statusDot.className = `w-2 h-2 rounded-full ${color}`;
            statusText.innerText = status;
            if(status === 'PROCESSING') {
                statusDot.classList.remove('bg-slate-600');
                statusDot.classList.add('animate-pulse');
            } else {
                statusDot.classList.remove('animate-pulse');
            }
        }

        function formatCardNumber(val) {
            return val.replace(/\s/g, '').replace(/(.{4})/g, '$1 ').trim();
        }

        // ---------------------------------------------------------
        // INPUT FORMATTING
        // ---------------------------------------------------------
        document.getElementById('cardNumber').addEventListener('input', function(e) {
            e.target.value = formatCardNumber(e.target.value);
        });
        
        document.getElementById('cardExpiry').addEventListener('input', function(e) {
            let input = e.target.value.replace(/\D/g, '');
            if (input.length >= 2) {
                input = input.substring(0,2) + '/' + input.substring(2,4);
            }
            e.target.value = input;
        });

        // ---------------------------------------------------------
        // STRIPE LOGIC
        // ---------------------------------------------------------
        async function processCharge() {
            const btn = document.getElementById('chargeBtn');
            const amtInput = document.getElementById('chargeAmt').value;
            const amount = parseFloat(amtInput) * 100; // Stripe expects cents

            if (!STRIPE_PUBLIC_KEY || STRIPE_PUBLIC_KEY === "pk_test_YOUR_KEY_HERE") {
                addLog("ERROR: Stripe Public Key not configured in script.", 'error');
                return;
            }

            const stripe = Stripe(STRIPE_PUBLIC_KEY);
            
            // UI Loading State
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> PROCESSING';
            setStatus('PROCESSING', 'bg-blue-500');
            resultBadge.innerText = 'PENDING';
            resultBadge.className = 'inline-block px-3 py-1 rounded-full bg-slate-800 text-xs font-bold text-blue-400 border border-blue-500/30';

            try {
                // 1. Create Token
                addLog("Initiating tokenization...");
                const { token, error } = await stripe.createToken({
                    number: document.getElementById('cardNumber').value.replace(/\s/g, ''),
                    exp_month: parseInt(document.getElementById('cardExpiry').value.split('/')[0]),
                    exp_year: parseInt('20' + document.getElementById('cardExpiry').value.split('/')[1]),
                    cvc: document.getElementById('cardCvc').value,
                    address_zip: document.getElementById('cardZip').value,
                });

                if (error) {
                    throw new Error(error.message);
                }

                addLog(`Token created: ${token.id}`);
                
                // 2. Simulate Charge (Since we don't have a backend to charge the token immediately)
                // In a real app, you send 'token.id' to your server to charge it.
                // Here we simulate a success/fail based on the card type for demonstration.
                
                await new Promise(r => setTimeout(r, 1500)); // Fake delay

                // Logic to determine outcome based on common test cards
                const cardNum = document.getElementById('cardNumber').value.replace(/\s/g, '');
                let isLive = false;
                let authCode = "";
                let avsStatus = "";

                // Basic simulation logic for demo purposes
                if(cardNum.startsWith('4')) { 
                    isLive = true; 
                    authCode = "APPROVED";
                    avsStatus = "Y";
                } else {
                    isLive = false;
                    authCode = "DECLINED";
                    avsStatus = "N";
                }

                // Output Result
                if (isLive) {
                    setStatus('ONLINE', 'bg-emerald-500');
                    resultBadge.innerText = 'APPROVED';
                    resultBadge.className = 'inline-block px-3 py-1 rounded-full bg-emerald-500/10 text-xs font-bold text-emerald-400 border border-emerald-500/30 live-status';
                    
                    addLog(`Charge Success: $${(amount/100).toFixed(2)}`, 'success');
                    addLog(`Auth Code: ${authCode} | AVS: ${avsStatus}`, 'success');
                } else {
                    setStatus('OFFLINE', 'bg-red-500');
                    resultBadge.innerText = 'DECLINED';
                    resultBadge.className = 'inline-block px-3 py-1 rounded-full bg-red-500/10 text-xs font-bold text-red-400 border border-red-500/30 dead-status';
                    
                    addLog(`Charge Failed: $${(amount/100).toFixed(2)}`, 'error');
                    addLog(`Reason: ${authCode} | AVS: ${avsStatus}`, 'error');
                }

            } catch (err) {
                addLog(`Error: ${err.message}`, 'error');
                setStatus('ERROR', 'bg-red-500');
                resultBadge.innerText = 'ERROR';
                resultBadge.className = 'inline-block px-3 py-1 rounded-full bg-red-900/20 text-xs font-bold text-red-400 border border-red-500/30';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-bolt"></i> CHARGE';
            }
        }
    </script>
</body>
</html>
