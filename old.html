
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CC Validator Pro</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      color: white;
      margin-bottom: 40px;
    }

    .header h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
    }

    .header p {
      font-size: 1.1em;
      opacity: 0.9;
    }

    .input-section {
      background: white;
      border-radius: 15px;
      padding: 30px;
      margin-bottom: 30px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    }

    .input-section label {
      display: block;
      font-weight: 600;
      margin-bottom: 10px;
      color: #333;
    }

    .input-section p {
      color: #666;
      font-size: 0.9em;
      margin-bottom: 15px;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 15px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-family: 'Courier New', monospace;
      font-size: 0.95em;
      resize: vertical;
      transition: border-color 0.3s;
    }

    textarea:focus {
      outline: none;
      border-color: #667eea;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 1em;
    }

    .validate-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .validate-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }

    .validate-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .filter-btn {
      background: #f0f0f0;
      color: #333;
      border: 2px solid #e0e0e0;
    }

    .filter-btn:hover {
      background: #e8e8e8;
      border-color: #667eea;
    }

    .filter-btn.active {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }

    .progress {
      width: 100%;
      height: 6px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-top: 20px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      width: 0%;
      transition: width 0.3s;
    }

    .results-section {
      margin-top: 30px;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      color: white;
    }

    .results-header h2 {
      font-size: 1.5em;
    }

    .stats {
      display: flex;
      gap: 15px;
      font-size: 0.95em;
    }

    .stat {
      background: rgba(255, 255, 255, 0.2);
      padding: 8px 15px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      cursor: pointer;
      transition: all 0.3s;
    }

    .stat:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .stat.valid {
      background: rgba(76, 175, 80, 0.3);
    }

    .stat.invalid {
      background: rgba(244, 67, 54, 0.3);
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
      transition: all 0.3s;
      border-left: 5px solid #667eea;
      animation: slideIn 0.5s ease-out forwards;
      opacity: 0;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card:nth-child(1) { animation-delay: 0.05s; }
    .card:nth-child(2) { animation-delay: 0.1s; }
    .card:nth-child(3) { animation-delay: 0.15s; }
    .card:nth-child(4) { animation-delay: 0.2s; }
    .card:nth-child(5) { animation-delay: 0.25s; }
    .card:nth-child(n+6) { animation-delay: 0.3s; }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }

    .card.valid {
      border-left-color: #4caf50;
    }

    .card.invalid {
      border-left-color: #f44336;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 15px;
    }

    .card-bank {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bank-emoji {
      font-size: 1.8em;
    }

    .bank-info {
      display: flex;
      flex-direction: column;
    }

    .bank-name {
      font-weight: 700;
      color: #333;
      font-size: 0.95em;
    }

    .bank-country {
      font-size: 0.8em;
      color: #999;
    }

    .status-badge {
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.85em;
    }

    .status-badge.valid {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .status-badge.invalid {
      background: #ffebee;
      color: #c62828;
    }

    .card-number {
      font-family: 'Courier New', monospace;
      font-size: 0.9em;
      color: #666;
      margin-bottom: 12px;
      word-break: break-all;
    }

    .card-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
      font-size: 0.85em;
    }

    .detail-item {
      background: #f5f5f5;
      padding: 8px;
      border-radius: 8px;
    }

    .detail-label {
      color: #999;
      font-size: 0.8em;
      margin-bottom: 3px;
    }

    .detail-value {
      color: #333;
      font-weight: 600;
    }

    .card-reason {
      background: #f9f9f9;
      padding: 12px;
      border-radius: 8px;
      border-left: 3px solid #667eea;
      margin-top: 12px;
    }

    .reason-label {
      font-size: 0.8em;
      color: #999;
      margin-bottom: 4px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .reason-text {
      font-size: 0.9em;
      color: #333;
      line-height: 1.4;
    }

    .reason-text.valid {
      color: #2e7d32;
    }

    .reason-text.invalid {
      color: #c62828;
    }

    .bin-info {
      background: #e3f2fd;
      padding: 10px;
      border-radius: 8px;
      margin-top: 10px;
      border-left: 3px solid #2196f3;
      font-size: 0.85em;
    }

    .bin-info-label {
      color: #1565c0;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .bin-info-value {
      color: #0d47a1;
    }

    .vbv-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75em;
      font-weight: 600;
      margin-top: 4px;
    }

    .vbv-badge.yes {
      background: #c8e6c9;
      color: #1b5e20;
    }

    .vbv-badge.no {
      background: #ffccbc;
      color: #bf360c;
    }

    .vbv-badge.unknown {
      background: #f0f0f0;
      color: #666;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: white;
    }

    .empty-state-icon {
      font-size: 3em;
      margin-bottom: 15px;
    }

    .empty-state p {
      font-size: 1.1em;
      opacity: 0.9;
    }

    /* Modal Styles */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .modal-overlay.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal {
      background: white;
      border-radius: 15px;
      width: 90%;
      max-width: 600px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .modal-header {
      padding: 20px;
      border-bottom: 2px solid #f0f0f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 {
      color: #333;
      font-size: 1.3em;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.5em;
      cursor: pointer;
      color: #999;
      transition: color 0.3s;
    }

    .modal-close:hover {
      color: #333;
    }

    .modal-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .valid-card-item {
      background: #f9f9f9;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      border-left: 4px solid #4caf50;
      animation: slideIn 0.3s ease-out;
    }

    .valid-card-item:last-child {
      margin-bottom: 0;
    }

    .valid-card-number {
      font-family: 'Courier New', monospace;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
      font-size: 0.95em;
    }

    .valid-card-meta {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      font-size: 0.8em;
      margin-bottom: 8px;
    }

    .valid-card-meta-item {
      background: white;
      padding: 6px;
      border-radius: 6px;
      text-align: center;
    }

    .valid-card-meta-label {
      color: #999;
      font-size: 0.75em;
    }

    .valid-card-meta-value {
      color: #333;
      font-weight: 600;
    }

    .valid-card-bank {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85em;
      margin-bottom: 8px;
    }

    .valid-card-bank-emoji {
      font-size: 1.2em;
    }

    .charge-section {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #e0e0e0;
    }

    .charge-dropdown {
      width: 100%;
      padding: 8px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      font-size: 0.9em;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .charge-btn {
      width: 100%;
      padding: 8px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9em;
      transition: all 0.3s;
    }

    .charge-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .charge-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    @media (max-width: 768px) {
      .cards-grid {
        grid-template-columns: 1fr;
      }

      .header h1 {
        font-size: 1.8em;
      }

      .button-group {
        flex-direction: column;
      }

      .modal {
        width: 95%;
        max-height: 90vh;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>💳 CC Validator Pro</h1>
      <p>Advanced credit card validation with bank detection</p>
    </div>

    <div class="input-section">
      <label>Paste Card Data</label>
      <p>Supports formats: NUMBER|MM|YYYY|CVV or NUMBER|MM|YY|CVV or just NUMBER</p>
      <textarea id="ccInput" placeholder="4867864092133670|10|2027|349
4031631179624769|05|2025|475
5500000000000004|12|2030|123"></textarea>
      <div class="button-group">
        <button class="validate-btn" id="validateBtn">Validate Cards</button>
        <button class="filter-btn" id="filterBtn">Show Valid Only</button>
      </div>
      <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>

    <div class="results-section" id="resultsSection" style="display: none;">
      <div class="results-header">
        <h2>Results</h2>
        <div class="stats">
          <div class="stat valid" id="validStat">✓ Valid: <span id="validCount">0</span></div>
          <div class="stat invalid">✗ Invalid: <span id="invalidCount">0</span></div>
          <div class="stat">Total: <span id="totalCount">0</span></div>
        </div>
      </div>
      <div class="cards-grid" id="cardsGrid"></div>
    </div>

    <div class="empty-state" id="emptyState" style="display: none;">
      <div class="empty-state-icon">📭</div>
      <p>No results to display</p>
    </div>
  </div>

  <!-- Modal for Valid Cards -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h2>Valid Cards</h2>
        <button class="modal-close" id="modalClose">✕</button>
      </div>
      <div class="modal-content" id="modalContent"></div>
    </div>
  </div>

  <script>
    const bankDatabase = {
      '4': { name: 'Visa', emoji: '🏦', country: 'USA' },
      '5': { name: 'Mastercard', emoji: '💳', country: 'USA' },
      '3': { name: 'American Express', emoji: '🎫', country: 'USA' },
      '6': { name: 'Discover', emoji: '🔍', country: 'USA' },
    };

    const countryEmojis = {
      'USA': '🇺🇸',
      'UK': '🇬🇧',
      'CA': '🇨🇦',
      'AU': '🇦🇺',
      'DE': '🇩🇪',
      'FR': '🇫🇷',
      'JP': '🇯🇵',
      'CN': '🇨🇳',
      'IN': '🇮🇳',
      'BR': '🇧🇷',
    };

    let allResults = [];

    function getBankInfo(cardNumber) {
      const firstDigit = cardNumber.charAt(0);
      return bankDatabase[firstDigit] || { name: 'Unknown Bank', emoji: '🏧', country: 'Unknown' };
    }

    async function getBINInfo(cardNumber) {
      try {
        const bin = cardNumber.substring(0, 6);
        const response = await fetch(`https://binlist.io/lookup/${bin}/`);
        if (!response.ok) throw new Error('BIN lookup failed');
        const data = await response.json();
        return {
          bank: data.bank?.name || 'Unknown',
          country: data.country?.name || 'Unknown',
          type: data.type || 'Unknown',
          brand: data.scheme || 'Unknown',
          vbv: data.security?.cvv ? true : false
        };
      } catch (error) {
        return {
          bank: 'Unknown',
          country: 'Unknown',
          type: 'Unknown',
          brand: 'Unknown',
          vbv: null
        };
      }
    }

    function luhnCheck(cardNumber) {
      const cleaned = cardNumber.replace(/\D/g, '');
      if (!cleaned || cleaned.length < 13 || cleaned.length > 19) {
        return { valid: false, reason: `Invalid length: ${cleaned.length} digits (13-19 required)` };
      }

      let sum = 0;
      let shouldDouble = false;

      for (let i = cleaned.length - 1; i >= 0; i--) {
        let digit = parseInt(cleaned.charAt(i), 10);

        if (shouldDouble) {
          digit *= 2;
          if (digit > 9) digit = (digit % 10) + 1;
        }

        sum += digit;
        shouldDouble = !shouldDouble;
      }

      const isValid = sum % 10 === 0;
      return {
        valid: isValid,
        reason: isValid ? `Luhn checksum valid (sum: ${sum})` : `Luhn checksum failed (sum: ${sum}, not divisible by 10)`
      };
    }

    function isExpired(month, year) {
      if (!month || !year) return { valid: true, reason: 'No expiry date provided' };

      const currentDate = new Date();
      const currentYear = currentDate.getFullYear();
      const currentMonth = currentDate.getMonth() + 1;

      let expiryYear = parseInt(year, 10);
      const expiryMonth = parseInt(month, 10);

      if (year.length === 2) {
        expiryYear = expiryYear < 50 ? 2000 + expiryYear : 1900 + expiryYear;
      }

      if (expiryMonth < 1 || expiryMonth > 12) {
        return { valid: false, reason: `Invalid month: ${month}` };
      }

      if (expiryYear < currentYear) {
        return { valid: false, reason: `Expired: ${month}/${year} (year in past)` };
      }

      if (expiryYear === currentYear && expiryMonth < currentMonth) {
        return { valid: false, reason: `Expired: ${month}/${year} (month in past)` };
      }

      return { valid: true, reason: `Expires: ${month}/${year}` };
    }

    function parseCardData(line) {
      const parts = line.split('|').map(p => p.trim());
      return {
        number: parts[0] || '',
        month: parts[1] || '',
        year: parts[2] || '',
        cvv: parts[3] || ''
      };
    }

    async function validateCard(line) {
      const data = parseCardData(line);
      const luhnResult = luhnCheck(data.number);
      const expiryResult = isExpired(data.month, data.year);
      const binInfo = await getBINInfo(data.number);

      const isValid = luhnResult.valid && expiryResult.valid;
      const bankInfo = getBankInfo(data.number);

      return {
        original: line,
        number: data.number,
        month: data.month,
        year: data.year,
        cvv: data.cvv,
        isValid,
        luhnResult,
        expiryResult,
        bankInfo,
        binInfo,
        reasons: [luhnResult.reason, expiryResult.reason]
      };
    }

    function createCardElement(result) {
      const card = document.createElement('div');
      card.className = `card ${result.isValid ? 'valid' : 'invalid'}`;
      card.style.display = 'none';
      card.dataset.valid = result.isValid;

      const maskedNumber = result.number.slice(-4).padStart(result.number.length, '*');
      const vbvStatus = result.binInfo.vbv === true ? 'Yes' : result.binInfo.vbv === false ? 'No' : 'Unknown';
      const vbvClass = result.binInfo.vbv === true ? 'yes' : result.binInfo.vbv === false ? 'no' : 'unknown';

      card.innerHTML = `
        <div class="card-header">
          <div class="card-bank">
            <div class="bank-emoji">${result.bankInfo.emoji}</div>
            <div class="bank-info">
              <div class="bank-name">${result.bankInfo.name}</div>
              <div class="bank-country">${countryEmojis[result.bankInfo.country] || '🌍'} ${result.bankInfo.country}</div>
            </div>
          </div>
          <div class="status-badge ${result.isValid ? 'valid' : 'invalid'}">
            ${result.isValid ? '✓ Valid' : '✗ Invalid'}
          </div>
        </div>

        <div class="card-number">${maskedNumber}</div>

        <div class="card-details">
          ${result.month ? `<div class="detail-item"><div class="detail-label">Month</div><div class="detail-value">${result.month}</div></div>` : ''}
          ${result.year ? `<div class="detail-item"><div class="detail-label">Year</div><div class="detail-value">${result.year}</div></div>` : ''}
          ${result.cvv ? `<div class="detail-item"><div class="detail-label">CVV</div><div class="detail-value">***</div></div>` : ''}
        </div>

        <div class="bin-info">
          <div class="bin-info-label">BIN Information</div>
          <div class="bin-info-value">Bank: ${result.binInfo.bank}</div>
          <div class="bin-info-value">Type: ${result.binInfo.type}</div>
          <div class="bin-info-value">Brand: ${result.binInfo.brand}</div>
          <div class="vbv-badge ${vbvClass}">VBV: ${vbvStatus}</div>
        </div>

        <div class="card-reason">
          <div class="reason-label">Validation Details</div>
          ${result.reasons.map(reason => `<div class="reason-text ${result.isValid ? 'valid' : 'invalid'}">• ${reason}</div>`).join('')}
        </div>
      `;

      return card;
    }

    function createValidCardItem(result) {
      const item = document.createElement('div');
      item.className = 'valid-card-item';

      const vbvStatus = result.binInfo.vbv === true ? 'Yes' : result.binInfo.vbv === false ? 'No' : 'Unknown';
      const vbvClass = result.binInfo.vbv === true ? 'yes' : result.binInfo.vbv === false ? 'no' : 'unknown';

      item.innerHTML = `
        <div class="valid-card-number">${result.number}</div>
        <div class="valid-card-bank">
          <div class="valid-card-bank-emoji">${result.bankInfo.emoji}</div>
          <div>${result.bankInfo.name} - ${result.binInfo.bank}</div>
        </div>
        <div class="valid-card-meta">
          <div class="valid-card-meta-item">
            <div class="valid-card-meta-label">Expires</div>
            <div class="valid-card-meta-value">${result.month}/${result.year}</div>
          </div>
          <div class="valid-card-meta-item">
            <div class="valid-card-meta-label">CVV</div>
            <div class="valid-card-meta-value">${result.cvv || 'N/A'}</div>
          </div>
          <div class="valid-card-meta-item">
            <div class="valid-card-meta-label">VBV</div>
            <div class="valid-card-meta-value" style="color: ${vbvClass === 'yes' ? '#2e7d32' : vbvClass === 'no' ? '#c62828' : '#666'}">${vbvStatus}</div>
          </div>
        </div>
        <div class="charge-section">
          <select class="charge-dropdown" data-card-number="${result.number}">
            <option value="">Select Charge Amount</option>
            <option value="1">$1.00</option>
            <option value="5">$5.00</option>
            <option value="10">$10.00</option>
            <option value="25">$25.00</option>
            <option value="50">$50.00</option>
            <option value="100">$100.00</option>
            <option value="custom">Custom Amount</option>
          </select>
          <button class="charge-btn" data-card-number="${result.number}">Charge Card</button>
        </div>
      `;

      return item;
    }

    async function bulkValidate() {
      const input = document.getElementById('ccInput').value.trim();
      const lines = input.split('\n').map(line => line.trim()).filter(line => line);
      const cardsGrid = document.getElementById('cardsGrid');
      const progressBar = document.getElementById('progressBar');
      const validateBtn = document.getElementById('validateBtn');
      const resultsSection = document.getElementById('resultsSection');
      const emptyState = document.getElementById('emptyState');

      cardsGrid.innerHTML = '';
      validateBtn.disabled = true;
      progressBar.style.width = '0%';
      resultsSection.style.display = 'none';
      emptyState.style.display = 'none';
      allResults = [];

      if (lines.length === 0) {
        alert('No data provided.');
        validateBtn.disabled = false;
        return;
      }

      const batchSize = 10;
      const total = lines.length;
      let processed = 0;
      let validCount = 0;
      let invalidCount = 0;

      for (let i = 0; i < total; i += batchSize) {
        const batch = lines.slice(i, i + batchSize);

        for (const line of batch) {
          const result = await validateCard(line);
          allResults.push(result);
          const cardElement = createCardElement(result);
          cardsGrid.appendChild(cardElement);

          if (result.isValid) validCount++;
          else invalidCount++;
        }

        processed += batch.length;
        progressBar.style.width = `${(processed / total) * 100}%`;

        await new Promise(resolve => setTimeout(resolve, 100));
      }

      document.getElementById('validCount').textContent = validCount;
      document.getElementById('invalidCount').textContent = invalidCount;
      document.getElementById('totalCount').textContent = total;

      document.querySelectorAll('.card').forEach(card => card.style.display = '');

      resultsSection.style.display = 'block';
      validateBtn.disabled = false;
      progressBar.style.width = '0%';
    }

    function toggleFilter() {
      const filterBtn = document.getElementById('filterBtn');
      const cards = document.querySelectorAll('.card');
      const showValidOnly = filterBtn.classList.toggle('active');

      cards.forEach(card => {
        if (showValidOnly) {
          card.style.display = card.dataset.valid === 'true' ? '' : 'none';
        } else {
          card.style.display = '';
        }
      });

      filterBtn.textContent = showValidOnly ? 'Show All' : 'Show Valid Only';
    }

    function openValidCardsModal() {
      const validCards = allResults.filter(r => r.isValid);
      const modalContent = document.getElementById('modalContent');
      const modalOverlay = document.getElementById('modalOverlay');

      modalContent.innerHTML = '';

      if (validCards.length === 0) {
        modalContent.innerHTML = '<p style="text-align: center; color: #999;">No valid cards found</p>';
      } else {
        validCards.forEach(result => {
          const item = createValidCardItem(result);
          modalContent.appendChild(item);
        });

        // Add event listeners to charge buttons
        document.querySelectorAll('.charge-btn').forEach(btn => {
          btn.addEventListener('click', function() {
            const dropdown = this.previousElementSibling;
            const amount = dropdown.value;
            const cardNumber = this.dataset.cardNumber;

            if (!amount) {
              alert('Please select an amount');
              return;
            }

            if (amount === 'custom') {
              const customAmount = prompt('Enter custom amount ($):');
              if (customAmount && !isNaN(customAmount)) {
                alert(`Charging $${customAmount} to card ending in ${cardNumber.slice(-4)}`);
              }
            } else {
              alert(`Charging $${amount} to card ending in ${cardNumber.slice(-4)}`);
            }
          });
        });
      }

      modalOverlay.classList.add('active');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    document.getElementById('validateBtn').addEventListener('click', bulkValidate);
    document.getElementById('filterBtn').addEventListener('click', toggleFilter);
    document.getElementById('validStat').addEventListener('click', openValidCardsModal);
    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('modalOverlay').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });
  </script>
</body>
</html>
